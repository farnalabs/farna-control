# Hooks without an explicit `stages` run at the commit stage only; the pre-push
# stage is reserved for hooks explicitly tagged `stages: [pre-push]`. This keeps
# the commit gate broad and the push gate targeted.
default_stages: [pre-commit]
repos:
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [-r, backend/src/, -ll, -x, backend/src/farna/model_backends/stub/]
        files: ^backend/src/
        pass_filenames: false
        stages: [pre-commit]

  - repo: local
    hooks:
      # FAR-2308: backend/uv.lock records the project version and the resolved
      # dependency set. A pyproject.toml change without a matching lock update
      # makes `uv run` rewrite the lock mid-gate, pre-commit's stash/restore
      # collides, and pushes from any branch based on the stale tree abort. This
      # gate fires on EITHER file and fails closed. `--frozen` on the hook's own
      # `uv run` wrapper means the checker can never mutate the lock it checks.
      # CI mirrors it as the always-on "UV lockfile freshness" job (ci.yml) and
      # as a batch gate in merge-queue.yml.
      - id: check-uv-lock
        name: check uv lockfile freshness
        entry: uv run --project backend --no-sync --frozen python scripts/run_check_uv_lock.py
        language: system
        files: ^(backend/(pyproject\.toml|uv\.lock)|scripts/run_check_uv_lock\.py)$
        pass_filenames: false
      - id: ruff
        name: ruff (locked backend environment)
        # Keep pre-commit's scope identical to CI: lint the complete backend,
        # including tests, from backend/ rather than only staged files.
        entry: uv --directory backend run --no-sync --frozen ruff check .
        language: system
        files: ^backend/
        pass_filenames: false
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format (locked backend environment)
        # CI runs the format check across the whole backend; pre-commit keeps
        # its fixer scoped to files being committed to avoid rewriting unrelated
        # pre-existing formatting drift.
        entry: uv run --project backend --no-sync --frozen ruff format
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: true
        stages: [pre-commit]
      - id: mypy
        name: mypy (locked backend environment)
        entry: uv --directory backend run --no-sync --frozen mypy --strict --ignore-missing-imports src/
        language: system
        files: ^backend/src/
        pass_filenames: false
        stages: [manual]
      - id: check-migration-heads
        name: check migration number/revision collisions
        entry: uv run --project backend --no-sync --frozen python scripts/run_check_migration_heads.py
        language: system
        files: ^backend/src/farna/db/migrations/versions/.*\.py$
        pass_filenames: false
      - id: semgrep
        name: semgrep
        entry: uv run --project backend --no-sync --frozen python scripts/run_semgrep.py
        language: system
        files: ^backend/src/
        pass_filenames: false
        stages: [pre-commit]
      - id: validate-semgrep-rules
        name: validate .semgrep rule files (shape)
        entry: uv run --project backend --no-sync --frozen python scripts/run_validate_semgrep_rules.py
        language: system
        files: ^\.semgrep/.*\.ya?ml$
        pass_filenames: false
        stages: [pre-commit]
      - id: vulture
        name: vulture (dead code gate)
        entry: uv run --project backend --no-sync --frozen python scripts/run_vulture.py
        language: system
        types: [python]
        files: ^backend/src/
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.3
    hooks:
      - id: gitleaks
        args: ['--verbose']

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        # Exclude only the Helm templates (Go-templated, not plain YAML).
        # values*.yaml and Chart.yaml are valid plain YAML and must be checked.
        exclude: ^deploy/helm/farna-control/templates/
      - id: check-toml
      - id: check-json
      # A file-rewriting fixer at pre-push rewrites the tree AFTER the commit, so
      # the rewrite is never in the pushed commit and the working tree is dirty.
      # They belong at commit time only.
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/pypa/pip-audit
    rev: v2.10.1
    hooks:
      - id: pip-audit
        name: pip-audit (backend)
        args:
          - backend/
        files: ^backend/(pyproject\.toml|uv\.lock)$
        pass_filenames: false
        stages: [manual]

  - repo: local
    hooks:
      - id: import-linter
        name: import-linter
        entry: uv --directory backend run --no-sync --frozen lint-imports
        language: system
        files: ^backend/src/
        pass_filenames: false
      - id: generate-api-types
        name: Generate API types from OpenAPI schema
        entry: uv run --project backend --no-sync --frozen python scripts/run_generate_api_types.py
        language: system
        files: ^backend/src/
        pass_filenames: false
        stages: [manual]
      - id: eslint
        name: ESLint
        entry: uv run --project backend --no-sync --frozen python scripts/run_frontend_npm.py lint
        language: system
        # Match the CI lint command's scope (frontend/package.json):
        # `eslint src tests/visual-baseline tests/e2e`. tests/e2e is included so
        # the e2e specs are actually gated (they carry a scoped `no-console`
        # override in eslint.config.mjs; without this scope that override would
        # enforce nothing and violations silently accumulate - FAR-2761). The
        # pattern stays narrowed to those three roots rather than repo-wide, so
        # generated/doc examples outside them are not swept in.
        files: ^frontend/(src/.*\.(vue|ts|js)|tests/visual-baseline/.*\.mjs|tests/e2e/.*\.ts)$
        pass_filenames: true
      - id: vue-tsc
        name: vue-tsc type check
        entry: uv run --project backend --no-sync --frozen python scripts/run_frontend_npm.py type-check
        language: system
        files: \.(vue|ts)$
        pass_filenames: false
        stages: [manual]
      - id: check-c1-chars
        name: check C1 control characters in workflow files
        entry: uv run --project backend --no-sync --frozen python scripts/run_check_c1_chars.py
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false
      - id: validate-graph-schema
        name: validate canonical frontend graph writes
        entry: uv run --project backend --no-sync --frozen python scripts/run_validate_graph_schema.py
        language: system
        files: ^(frontend/src/.*\.(vue|ts|js)|scripts/run_validate_graph_schema\.py)$
        pass_filenames: false
        stages: [pre-commit]




      # FAR-1847: deploy-critical guard. deploy.yml runs
      # `playwright test --grep "@regression"` against staging before promoting
      # to production, so an E2E caller whose method no longer matches the live
      # route blocks the deploy - and a stale page.route interceptor keeps
      # passing while asserting nothing. Checks frontend/tests/e2e/** against
      # the backend's OpenAPI route table.
      - id: check-e2e-route-methods
        name: check E2E HTTP calls match live API routes
        entry: uv run --project backend --no-sync --frozen python scripts/run_check_e2e_route_methods.py
        language: system
        files: ^(frontend/tests/e2e/.*|backend/src/farna/api/.*|scripts/run_check_e2e_route_methods\.py)$
        pass_filenames: false

      - id: check-utf8
        name: check UTF-8 encoding (no corrupted files)
        entry: uv run --project backend --no-sync --frozen python scripts/run_check_utf8_encoding.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: run-changed-tests
        name: run tests for changed test files
        entry: uv run --project backend --no-sync --frozen python scripts/run_changed_tests.py
        language: system
        files: ^backend/tests/.*\.py$
        pass_filenames: false
        stages: [pre-commit]
      - id: validate-translations
        name: validate sidebar nav translation keys
        entry: uv run --project backend --no-sync --frozen python scripts/run_validate_translations.py
        language: system
        files: ^frontend/src/(config/navigation\.ts|locales/en-US\.js|manifest\.yaml)$
        pass_filenames: false
      # FAR-52: manifest group-id / sidebar_order structure + manifest <->
      # navigation.ts route-id parity. Label-key/locale parity lives in the
      # validate-translations hook above; this one owns the structure rules.
      - id: validate-nav-config
        name: validate manifest nav structure (groups, sidebar_order, route-id parity)
        entry: uv run --project backend --no-sync --frozen python scripts/run_validate_nav_config.py
        language: system
        files: ^(frontend/src/manifest\.yaml|frontend/src/config/navigation\.ts)$
        pass_filenames: false
      # Product map consistency (declared data-testids) -- guards the manifest
      # drift class that costs a 45-min round trip (Branch Fixer patches the
      # manifest). Only fires when manifest, views/ or components/ change.
      - id: product-map-consistency
        name: product map consistency (declared data-testids)
        entry: uv run --directory backend --no-sync --frozen python -m pytest tests/architecture/test_product_map_consistency.py -q -W "error::pytest.PytestUnraisableExceptionWarning" --disable-warnings
        language: system
        files: ^frontend/src/(manifest\.yaml|views/|components/)
        pass_filenames: false
      # TEMPORARY (FAR-588 / ADR 029 D3): forbids the retired "sandbox agent" /
      # "external agent" user-facing terms in locales + views/components.
      # Remove this hook (and scripts/run_check_vocabulary_sweep.py) at GA.
      - id: check-vocabulary-sweep
        name: forbid retired sandbox/external agent vocabulary (remove at GA)
        entry: uv run --project backend --no-sync --frozen python scripts/run_check_vocabulary_sweep.py
        language: system
        files: ^frontend/src/(locales/.*\.js|views/.*\.vue|components/.*\.vue)$
        pass_filenames: false
      - id: validate-pipeline-configs
        name: validate pipeline configs (agent_prompt, timeout_seconds, template_id)
        entry: uv run --directory backend --no-sync --frozen python ../scripts/validate_pipeline_configs.py
        language: system
        files: ^(backend/src/farna/core/pipeline_engine/node_runner\.py|backend/src/farna/api/mcp_server\.py|scripts/validate_pipeline_configs\.py)$
        pass_filenames: false
      # FAR-263: the docs-validity checker is reachable by no other gate (ruff
      # is scoped to ^backend/), so it could rot silently. --no-urls keeps the
      # commit hook off the network; the URL pass is run by hand.
      - id: check-doc-validity
        name: docs validity sweep (no network)
        entry: uv run --project backend --no-sync --frozen python scripts/check_doc_validity.py --no-urls
        language: system
        files: ^(README\.md|docs/.*\.md)$
        pass_filenames: false
        stages: [pre-commit]
      # Guard the checker's own detection rules (ghcr placeholder handling, path
      # extraction, capped-run exit code) whenever the script itself changes.
      - id: check-doc-validity-self-test
        name: docs validity checker self-test
        entry: uv run --project backend --no-sync --frozen python scripts/check_doc_validity.py --self-test
        language: system
        files: ^scripts/check_doc_validity\.py$
        pass_filenames: false
        stages: [pre-commit]

  # CI-parity pre-push gate: mirrors key CI checks so a red-PR push is caught
  # locally before the CI round-trip. Install: pre-commit install --hook-type
  # pre-push (see CONTRIBUTING.md).
  #
  # What is deliberately NOT here, and why (leave it in the merge tier):
  # - the full backend unit suite — CI shards it across three runners; a
  #   pre-push copy would cost ~40 minutes per push;
  # - integration / BDD live-app / Playwright E2E — they need Docker, a browser
  #   and a running app, none of which exist in the E2B sandbox or on a plain
  #   developer machine. `prepush-affected-tests` prints an explicit
  #   "deferred to CI" line for each such suite rather than skipping silently;
  # - the changed-lines coverage gate (`scripts/run_coverage_gate.py`) — it
  #   reads `backend/coverage.xml` + `frontend/coverage/lcov.info`, which only
  #   exist after the instrumented CI runs. A local subset run would produce a
  #   report with the changed files partially measured, and diff-cover scores a
  #   file absent from the report at 0%, so the local gate would fail changes
  #   CI passes. Measured evidence is in the PR that added these hooks; it
  #   stays a merge-tier gate until a deterministic local instrumented run
  #   exists.
  - repo: local
    hooks:
      # EXACT `Lint (Backend)` mypy invocation (ci.yml backend-lint job,
      # working-directory: backend):  uv run --no-build --no-sync mypy src/farna/
      # NOT `--strict --ignore-missing-imports` — those flags change what mypy
      # reports and mask failures CI doesn't (and vice versa). See the
      # "Diagnose CI failures with the EXACT CI command" lesson.
      # `--frozen` is the FAR-2308 lock-safety flag only: it forbids uv from
      # rewriting backend/uv.lock, and changes nothing about what mypy analyses.
      - id: prepush-mypy
        name: prepush mypy (exact CI Lint Backend command)
        entry: uv run --project backend --no-sync --frozen python scripts/run_prepush_gated_check.py --pattern "backend/src/farna/**/*.py" -- uv --directory backend run --no-build --no-sync --frozen mypy src/farna/
        language: system
        files: ^backend/src/
        pass_filenames: false
        stages: [pre-push]
      # EXACT frontend type-check invocation (ci.yml frontend job):
      #   pnpm run type-check    (frontend/package.json: "vue-tsc --noEmit")
      # run_frontend_npm.py runs `pnpm run type-check` in frontend/ — same command.
      - id: prepush-vue-tsc
        name: prepush vue-tsc (exact CI type-check command)
        entry: uv run --project backend --no-sync --frozen python scripts/run_prepush_gated_check.py --pattern "frontend/src/**" -- uv run --project backend --no-sync --frozen python scripts/run_frontend_npm.py type-check
        language: system
        files: \.(vue|ts)$
        pass_filenames: false
        stages: [pre-push]
      # Local equivalent of CI's schema-freshness job: regenerate to a temp
      # file and fail if it differs from the committed schema.ts (never touches it).
      - id: prepush-schema-freshness
        name: prepush schema freshness (openapi-typescript@7.13.0 --check)
        entry: uv run --project backend --no-sync --frozen python scripts/run_prepush_gated_check.py --pattern "backend/src/**/*.py" -- uv run --project backend --no-sync --frozen python scripts/run_generate_api_types.py --check
        language: system
        files: ^(backend/src/.+\.py$)
        pass_filenames: false
        stages: [pre-push]
      # The architecture suite was the largest single red-CI class in the last
      # 80 failed runs (27 of the 30 failures in "Test (Backend) non-unit
      # suites" were the "Run architecture tests" step). It needs no DB and no
      # Docker, so it belongs here rather than in the CI round-trip. Two
      # patterns because the suite reads BOTH trees (it scans src/farna and the
      # frontend product map). `run_architecture_suite.py` sets an isolated
      # PYTEST_DEBUG_TEMPROOT (a stale global `pytest-current` symlink makes
      # pytest exit 1 with every test green) and refuses any scope wider than
      # tests/architecture.
      # Per-test timeout policy (FAR-2836): `run_architecture_suite.py` runs the
      # CI flags but with `--timeout=600`, NOT CI's 120s. One architecture test
      # (`test_eval_engine_unit_suite_passes_unchanged`) subprocess-runs the whole
      # eval_engine unit suite (18.6s idle, 163-178s under load); at 120s
      # pytest-timeout kills the xdist worker and a frontend-only push fails on a
      # loaded box though every test passes. The 600s floor is pinned by
      # tests/unit/scripts/test_run_architecture_suite.py — do not lower it.
      - id: prepush-architecture
        name: prepush architecture suite (CI invocation, load-tolerant per-test timeout)
        entry: uv run --project backend --no-sync --frozen python scripts/run_prepush_gated_check.py --pattern "backend/src/**/*.py" --pattern "frontend/src/**" --rerun-hint "uv run --project backend --no-sync --frozen python scripts/run_architecture_suite.py" -- uv run --project backend --no-sync --frozen python scripts/run_architecture_suite.py
        language: system
        files: ^(backend/src/|frontend/src/)
        pass_filenames: false
        stages: [pre-push]
      # A source change now runs its AFFECTED tests, not only a changed test
      # file (the pre-commit `run-changed-tests` hook covers the latter). The
      # --prepush profile reuses `run_affected_tests.py`'s existing source→test
      # mapper and adds the bounds: file cap, wall-clock budget, no Docker
      # suites, and a hard refusal when the path scope cannot be resolved.
      - id: prepush-affected-tests
        name: prepush affected tests for changed sources
        entry: uv run --project backend --no-sync --frozen python scripts/run_prepush_gated_check.py --pattern "backend/src/**/*.py" --rerun-hint "uv run --project backend --no-sync --frozen python scripts/run_affected_tests.py --prepush" -- uv run --project backend --no-sync --frozen python scripts/run_affected_tests.py --prepush
        language: system
        files: ^backend/src/
        pass_filenames: false
        stages: [pre-push]
      # ERR_PNPM_OUTDATED_LOCKFILE was six of the failed frontend/merge-queue
      # steps in the same 80-run window. The exact CI command, run from
      # frontend/. Gated on the three files that feed the lockfile (pnpm v10+
      # reads `overrides` ONLY from pnpm-workspace.yaml).
      - id: prepush-pnpm-lock
        name: prepush pnpm lockfile freshness (--frozen-lockfile)
        entry: uv run --project backend --no-sync --frozen python scripts/run_check_pnpm_lock.py
        language: system
        files: ^frontend/(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)$
        pass_filenames: false
        stages: [pre-push]
      - id: prepush-merge-conflict-check
        name: prepush merge-conflict-with-main check
        entry: uv run --project backend --no-sync --frozen python scripts/run_check_merge_conflict.py
        language: system
        pass_filenames: false
        stages: [pre-push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: mixed-line-ending
        args: [--fix=lf]
        files: '\.(sh|bash|zsh|env)$'
