rules:
  - id: raw-status-complete
    patterns:
      - pattern-either:
          - pattern: |
              $OBJ.status == "complete"
          - pattern: |
              $OBJ.status == 'complete'
          - pattern: |
              $OBJ.status != "complete"
          - pattern: |
              $OBJ.status != 'complete'
          - patterns:
              - pattern: |
                  $VAR == "complete"
              - metavariable-regex:
                  metavariable: $VAR
                  regex: '.*status.*'
          - patterns:
              - pattern: |
                  $VAR == 'complete'
              - metavariable-regex:
                  metavariable: $VAR
                  regex: '.*status.*'
          - patterns:
              - pattern: |
                  $VAR != "complete"
              - metavariable-regex:
                  metavariable: $VAR
                  regex: '.*status.*'
          - patterns:
              - pattern: |
                  $VAR != 'complete'
              - metavariable-regex:
                  metavariable: $VAR
                  regex: '.*status.*'
          - patterns:
              - pattern: |
                  $VAR in ("complete", ...)
              - metavariable-regex:
                  metavariable: $VAR
                  regex: '.*status.*'
          - patterns:
              - pattern: |
                  $VAR in ('complete', ...)
              - metavariable-regex:
                  metavariable: $VAR
                  regex: '.*status.*'
    message: |
      Raw `status == "complete"` (or `!= "complete"` / `in ("complete", ...)`)
      comparison bypasses the shared status-enum / success-predicate module
      (agent-failure UX design §15.2). A single success predicate
      `is_success = (status == 'complete' OR accepted_as_complete IS TRUE) AND ...`
      is being introduced in a later phase, so consumer code must stop treating
      raw `status == "complete"` as success. Route raw status checks through
      the shared status-enum / success-predicate module instead. Known
      pre-existing consumer sites are path-excluded below until the Phase 2
      accept-as-complete sweep (FAR-146) rewrites them.
    languages: [python]
    severity: WARNING
    metadata:
      cwe:
        - "CWE-697: Incorrect Comparison"
      license: MIT
      version: "1.0"
    paths:
      include:
        - "**/backend/src/**"
      exclude:
        # Pre-existing raw status == 'complete' consumers. These are excluded
        # ONLY until the Phase 2 accept-as-complete sweep (FAR-146) rewrites
        # them onto the shared success predicate - remove the file from this
        # list once its raw status check is gone.
        #
        # Note: semgrep constant-propagation means a comparison against a
        # module constant that resolves to 'complete' (e.g. builder.py's
        # `RunDailyFact.status == _COMPLETE_STATUS` where
        # `_COMPLETE_STATUS = "complete"`) also matches the rule.
        - "**/backend/src/farna/api/routes/dashboard.py"
        # Same pre-existing consumer site as dashboard.py above, relocated
        # verbatim into the shared facts-window helper (FAR-2820) so the
        # dashboard and Costs overviews read one run_daily_facts aggregate -
        # remove together with the dashboard.py entry when FAR-146 rewrites it.
        - "**/backend/src/farna/core/analytics/facts_window.py"
        - "**/backend/src/farna/db/crud/run.py"
        - "**/backend/src/farna/core/pipeline_execution.py"
        - "**/backend/src/farna/core/pipeline_engine/executor.py"
        # Same pre-existing consumer sites as executor.py, relocated verbatim by
        # the finalize/telemetry/execute-resume mixin extractions - remove
        # together with the executor.py entry when FAR-146 rewrites them.
        - "**/backend/src/farna/core/pipeline_engine/executor_parts/finalize.py"
        - "**/backend/src/farna/core/pipeline_engine/executor_parts/telemetry.py"
        - "**/backend/src/farna/core/pipeline_engine/executor_parts/run_execute.py"
        - "**/backend/src/farna/core/saq_worker.py"
        - "**/backend/src/farna/core/feedback_manager/__init__.py"
        - "**/backend/src/farna/core/analytics/builder.py"
