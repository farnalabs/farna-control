services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: farna_control_test
      POSTGRES_PASSWORD: farna_control_test
      POSTGRES_DB: farna_control_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farna_control_test"]
      interval: 2s
      timeout: 5s
      retries: 10
      # Same cold-first-start grace as the root compose's `db` (see the long
      # rationale there): a first-run initdb outlasts the 20s this retry budget
      # allows, even on the tmpfs data dir. start_period keeps that init from
      # marking the container unhealthy; steady-state detection is unchanged.
      start_period: 120s
