server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    root /usr/share/nginx/html;
    index index.html;

    # Host-keyed robots.txt: staging is not indexed (unreleased data); app/demo use the static allow-all file.
    location = /robots.txt {
        default_type text/plain;
        if ($host ~ "^staging-control\.farna\.dev$") {
            return 200 "User-agent: *\nDisallow: /\n";
        }
        try_files /robots.txt =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth discovery metadata (RFC 8414 / RFC 9728) - unauthenticated, must
    # reach the backend as JSON. Without this the `location /` SPA fallback
    # answers /.well-known/* with index.html (text/html) and stock MCP clients
    # cannot connect. nginx picks the LONGEST prefix, and none of these paths
    # match the static-extension regex below, so `location /` never wins here.
    location /.well-known/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering on;
        proxy_set_header Host $host;
    }

    # -------------------------------------------------------------------------
    # Native installer entry point — stable and version-pinned forms
    # -------------------------------------------------------------------------
    # /install.sh                 -> scripts/install.sh on the default branch (main)
    # /install.sh?version=<X.Y.Z> -> scripts/install.sh at release tag bundle-v<X.Y.Z>
    # See docs/product-map/infra/native-single-install.md.
    #
    # `location =` is an EXACT match, so nginx evaluates it before every prefix
    # and regex location and it can only ever match the single URI /install.sh:
    # it therefore cannot shadow /api/, /.well-known/, /mcp/, /ws, /health,
    # /robots.txt, /runtime-config.js or the `location /` SPA catch-all. The
    # static-extension regex further down cannot capture it either (.sh is not
    # in that alternation, and exact matches outrank regexes anyway). It is
    # grouped with the backend/health routes for readability; exact-match
    # precedence makes file order irrelevant to correctness here (the SPA
    # `location /` is defined earlier in this file yet cannot win on /install.sh).
    #
    # A `map` would be tidier for the version validation, but a map must be
    # declared in the http context and this file is a server-block include
    # (copied to /etc/nginx/conf.d/default.conf), so a map is not available.
    # The `if` blocks below are the documented safe form — an `if` whose body
    # only issues `return` — evaluated inside the location.
    location = /install.sh {
        # No `version` parameter at all -> the stable default-branch installer.
        # `(^|&)version=` matches the parameter anywhere in $args, so a present
        # but empty `?version=` counts as present and is validated (and refused).
        if ($args !~ "(^|&)version=") {
            return 302 https://raw.githubusercontent.com/farnalabs/farna-control/main/scripts/install.sh;
        }

        # A `version` was supplied: it must be a clean X.Y.Z, otherwise refuse
        # with 400 rather than silently serving the default branch.
        if ($arg_version !~ "^[0-9]+\.[0-9]+\.[0-9]+$") {
            return 400 "Invalid installer version: expected X.Y.Z (for example 0.3.329).";
        }

        return 302 https://raw.githubusercontent.com/farnalabs/farna-control/bundle-v$arg_version/scripts/install.sh;
    }

    # runtime-config.js is regenerated at container start and publishes a
    # global that changes across releases. Never let a client pin an immutable
    # copy of it: an exact match beats the static-extension regex below.
    location = /runtime-config.js {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
