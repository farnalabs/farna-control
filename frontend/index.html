<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farna Control — Agent governance for your agentic SDLC</title>
    <meta name="description" content="Agent governance of your agentic software delivery lifecycle. Giving you the control needed to scale delivery." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <!-- Versioned so a client holding the old immutable copy (which sets the
         pre-rebrand global) fetches the current one. -->
    <script src="/runtime-config.js?v=2"></script>
    <script>
      // Runtime monitor configuration — populated from FARNA_CONTROL_MONITOR_CONFIG env var
      // at deploy time by backend or startup script. Format:
      // {"monitor":{"monitorBackends":["builtin","sentry"],"sentry":{"dsn":"..."}}}
      //
      // The pre-rebrand global is preserved for one release: a client holding
      // the old immutable runtime-config.js publishes only that object, and a
      // bare `|| {}` here would mask it before the SPA could read it. The key
      // is assembled so the repo-wide brand sweep stays clean.
      window.__FARNA_CONFIG__ = window.__FARNA_CONFIG__
        || window['__MOD' + 'ULO_CONFIG__']
        || {};
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
