# workflow-lint - run actionlint over .github/workflows/** on every PR that
# touches a workflow, and on every push to main that does.
#
# Why this gate exists (FAR-1746): nothing enforced actionlint in CI before
# it, so the tree accumulated 101 findings - unused loop variables, unquoted
# expansions, ungrouped output redirects, and one real defect (unescaped
# backticks inside a heredoc that made bash eat text out of a flyctl drift
# issue body and print "command not found"). Every finding was cleared in the
# change that added this workflow, so the gate starts green: any NEW finding
# fails the PR.
#
# actionlint is installed from its release tarball with the sha256 pinned
# below (taken from the release's own actionlint_<version>_checksums.txt),
# exactly like the repo's verified-install convention for flyctl - no
# third-party marketplace action sits between the runner and the linter.
#
# What this gate proves, and why it is two steps (FAR-2606)
# --------------------------------------------------------
# The gate proves two things: actionlint's structural findings, and shellcheck's
# SC* findings inside `run:` blocks. actionlint runs shellcheck itself, one
# process per run block, and that per-block spawn was the entire cost: this job
# crossed its 10-minute `timeout-minutes` on every run from 2026-11-20 onward,
# on main and on every PR branch, so every PR carried a red check. actionlint
# with `-shellcheck=` finishes in well under a second.
#
# So the two proofs are split. `actionlint -shellcheck=` keeps the structural
# half; `scripts/run_check_workflow_shellcheck.py` runs the shellcheck half as
# one invocation per shell dialect over every extracted run block, using the
# same argv, dialect detection and disabled-rule list actionlint itself uses.
# Neither step may be dropped: a `-shellcheck=` with no shellcheck step would
# silently check nothing, and the shellcheck step fails loudly when it cannot
# run. `backend/tests/unit/test_workflow_lint_gate.py` pins both steps.
name: "Workflow lint (actionlint)"

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actionlint.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/actionlint.yaml"

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    env:
      # Bump deliberately: update ACTIONLINT_VERSION and ACTIONLINT_SHA256
      # together from the upstream release's checksums file.
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint (pinned, sha256-verified)
        shell: bash
        run: |
          set -euo pipefail
          # The shellcheck binary is the engine behind every SC* finding
          # actionlint reports inside `run:` blocks. If it is absent,
          # actionlint skips those rules SILENTLY and still exits 0 - a green
          # check that checked nothing. Refuse to run blind instead: the runner
          # image (built from actions/runner-images' Ubuntu 24.04 template)
          # ships shellcheck, so a missing binary means the image changed and
          # this gate needs a look.
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "::error::shellcheck is not on PATH - actionlint would silently skip every shellcheck rule, so this gate cannot honestly pass. Install shellcheck on the runner image rather than shipping a blind gate."
            exit 1
          fi
          # --proto/--proto-redir pin both the initial request AND any redirect
          # hop to HTTPS, so a compromised/misconfigured download host cannot
          # silently downgrade the transfer to plain http (SonarCloud
          # githubactions:S6506, CWE-319). Same flags the repo's other pinned
          # release-tarball downloads use (ci.yml sonar-scanner-cli,
          # k8s-conformance.yml helm/kind/kubectl).
          curl -fsSL --proto '=https' --proto-redir '=https' --retry 3 -o /tmp/actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 /tmp/actionlint "${HOME}/.local/bin/actionlint"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/actionlint" --version
          # Log the shellcheck version too: actionlint's SC* findings (the bulk
          # of what this gate enforces) are produced by this binary, so when the
          # runner image drifts and a finding's version-dependence is in
          # question, the version it ran under is right here in the log.
          shellcheck --version

      - name: Run actionlint structural checks on .github/workflows/**
        shell: bash
        run: |
          set -euo pipefail
          # Run from the repo root: actionlint discovers .github/workflows and
          # loads .github/actionlint.yaml (self-hosted runner labels) itself.
          # No -ignore list is passed, so actionlint's own exit code is the
          # gate: any structural finding fails this job.
          #
          # -shellcheck= disables actionlint's own shellcheck pass, whose
          # per-run-block process spawn is what timed this job out (FAR-2606).
          # The shellcheck proof is the next step, not dropped: it runs over the
          # same blocks with the same rules. Do not remove that step.
          actionlint -shellcheck=

      - name: Ensure PyYAML is importable (workflow parser dependency)
        shell: bash
        run: |
          set -euo pipefail
          # scripts/run_check_workflow_shellcheck.py parses the workflow tree
          # with PyYAML. The runner image usually carries it; install it only
          # when it is missing, pinned, so the gate never depends on whatever
          # version happens to be present.
          if python3 -c 'import yaml' 2>/dev/null; then
            python3 -c 'import yaml; print("PyYAML", yaml.__version__, "already present")'
          else
            # Ubuntu's system python is PEP 668 externally managed and the
            # runner is ephemeral, so installing into it is the supported path.
            python3 -m pip install --quiet --disable-pip-version-check --break-system-packages 'PyYAML==6.0.2'
            python3 -c 'import yaml; print("PyYAML", yaml.__version__, "installed")'
          fi

      - name: Run shellcheck over every workflow run block
        shell: bash
        run: |
          set -euo pipefail
          # The shellcheck half of this gate (FAR-2606): one shellcheck
          # invocation per dialect over every extracted `run:` block, instead
          # of actionlint's one process per block. The helper reproduces
          # actionlint's shell resolution, workflow-expression substitution and
          # disabled rule list, refuses to pass when shellcheck is missing, and exits
          # non-zero on any finding - so this step is the gate for SC* findings
          # and must never be made non-fatal.
          python3 scripts/run_check_workflow_shellcheck.py
