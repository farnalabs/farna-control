name: "CI: Fast Validation"
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  # NOTE (2026-11-27): there is deliberately NO `push:` trigger. main can only
  # change through the merge train, which validates the exact composed tree with
  # the FULL suite in merge-validate.yml before anything merges, so re-running
  # this workflow on every push to main would only repeat a subset of work the
  # train already proved. `workflow_dispatch` stays and is load-bearing:
  #   - merge-queue.yml dispatches this workflow on main after a merge
  #     (`gh workflow run ci.yml --ref main`);
  #   - release-unified.yml dispatches it on a release branch and requires a
  #     green "Schema freshness" job in that run before it will tag.
  #
  # WHAT THIS WORKFLOW IS, on a pull request: the fast tier only. The merge
  # train admits a PR solely on THIS workflow's run conclusion for the PR's
  # exact head SHA (.github/scripts/merge_train_admit.py), so it must stay green
  # and quick. Every whole-repo suite lives in merge-validate.yml and runs once
  # per train instead of ~150 times a day per PR:
  #   backend unit shards, architecture/connector/BDD-module suites, integration
  #   shards, Tier 1b testcontainers, full frontend vitest + WCAG + build, the
  #   Playwright mobile-nav / visual-token / canvas @visual / route-coverage
  #   gates, the Bundled Runner docker harness (FAR-773), SonarCloud (scan and
  #   its new-code quality gate) and the changed-lines coverage gate.
  # The extra PR-scoped Sonar new-issues COUNT gate is retired from the PR tier
  # (PR CI no longer runs a SonarCloud analysis, so there is no PR analysis to
  # query); the train's SonarCloud quality gate is the pre-merge quality signal,
  # and the count gate still runs on a manual dispatch that supplies a PR number.
  # A check that is cheap, deterministic and NOT duplicated there still runs
  # here: gitleaks, migration-heads (incl. the numeric-prefix collision check),
  # schema freshness, copy consistency, and the deploy-critical E2E route-method
  # guard.
  #
  # NOTE (FAR-773): the weekly Bundled Runner backstop cron deliberately does
  # NOT live here. A schedule trigger would fire this ENTIRE workflow, and the
  # backstop only needs the one harness job, so it lives in
  # runner-ci-backstop.yml (weekly cron -> the shared reusable
  # runner-ci-harness.yml with force=true).

env:
  # Dependabot PR runs never receive repository secrets (GitHub withholds them
  # for `dependabot[bot]`-authored pull_request events), so these two Settings
  # fields would arrive empty and fail validation at import
  # ("SECRET_KEY must be at least 32 bytes; got 0"), erroring every test module
  # that constructs the app. The fallbacks are fixed, non-production test
  # values - the same shape as the POSTGRES_PASSWORD fallback below - and are
  # only ever used when the real secret is unavailable. FERNET_KEY must stay a
  # valid 32-byte url-safe base64 key because cryptography.Fernet parses it.
  SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-only-placeholder-secret-key-not-for-production' }}
  FERNET_KEY: ${{ secrets.FERNET_KEY || 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' }}
  # Authenticate GitHub git fetches so `uv sync --frozen` can resolve git-pinned
  # dependencies (e.g. pytest-bdd @ refs/pull/827/head) without an anonymous
  # fetch-by-SHA, which GitHub rejects from CI runners.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: 'url.https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/.insteadOf'
  GIT_CONFIG_VALUE_0: "https://github.com/"

permissions:
  contents: read

# A newer push to the same PR cancels the in-flight run so a Branch Fixer /
# reviewer push storm does not bill a full run for every intermediate SHA.
# Cancellation is scoped to pull_request events ONLY: every other event
# (workflow_dispatch, including the merge queue's post-merge dispatch on main)
# gets a group keyed on the unique run id, so it can never be cancelled - nor
# can a queued run be displaced as the single "pending" run of a shared group.
# notify-pr-failure treats `cancelled()` as a failure, so it carries a
# superseded-SHA guard (see the "Skip if this run was superseded" step).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Cheap gates run on ALL events (PR + manual dispatch). The current-head gate
  # prevents superseded pull_request runs from starting anything; non-PR events
  # always pass through so a dispatch runs every job.

  current-head-gate:
    name: Current PR head gate
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      current: ${{ steps.check.outputs.current }}
    steps:
      - name: Verify this run still owns the PR head
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Non-PR event (${EVENT_NAME}) - current=true."
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          API_RC=0
          CURRENT_HEAD_SHA="$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.sha')" || API_RC=$?
          if [ "$API_RC" -ne 0 ] || [ -z "$CURRENT_HEAD_SHA" ]; then
            echo "::warning::Could not read the current PR head (rc=${API_RC}); failing open with current=true."
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CURRENT_HEAD_SHA" = "$RUN_HEAD_SHA" ]; then
            echo "PR #${PR_NUMBER} still points at ${RUN_HEAD_SHA}; current=true."
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::PR #${PR_NUMBER} moved from ${RUN_HEAD_SHA} to ${CURRENT_HEAD_SHA}; this run is superseded and expensive validation will be skipped."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

  changes:
    # One cheap, checkout-free path detector feeding the step-level path gates
    # on the jobs below. It reads the PR file list from the GitHub API (no
    # checkout, no toolchain: a few seconds) and publishes three outputs:
    #
    #   frontend           - the Frontend lint and type-check job has something
    #                        to validate: anything under frontend/, or this
    #                        workflow itself. (The e2e route-coverage script is
    #                        no longer a frontend trigger here: nothing in this
    #                        workflow invokes it - the merge train's frontend
    #                        job does - so its path was a dead trigger.)
    #   backend            - the change is NOT confined to frontend/ + docs, so
    #                        the affected-backend-tests job has something to
    #                        select from. False only when every changed file is
    #                        under frontend/ or is markdown/docs.
    #   e2e_route_methods  - an E2E spec, an API route module, the FAR-1847
    #                        guard, or the guard's own invocation (ci.yml /
    #                        pre-commit) changed, so the E2E route-method check
    #                        has something to validate.
    #
    # Every output is "true" for every event except pull_request (workflow
    # dispatch, merge-queue dispatches, release dispatches ALWAYS run
    # everything), and the detector FAILS OPEN: any API error, a 3000+ file PR
    # (the API's cap), or an empty list sets every output to true with a
    # ::warning::. Gated jobs skip at STEP level, never job level, so their
    # check still reports "success" (a job-level skip is surfaced as a non-green
    # "skipped" check, which the PR Reviewer flags - same reason
    # notify-pr-failure gates at step level).
    name: Detect changed paths
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      backend: ${{ steps.detect.outputs.backend }}
      e2e_route_methods: ${{ steps.detect.outputs.e2e_route_methods }}
    steps:
      - name: Detect changed paths
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          all_true() {
            {
              echo "frontend=true"
              echo "backend=true"
              echo "e2e_route_methods=true"
            } >> "$GITHUB_OUTPUT"
          }
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Event ${EVENT_NAME}: path gates disabled - running everything."
            all_true
            exit 0
          fi
          # `rc=0; out=$(...) || rc=$?` survives Actions' `bash -e -o pipefail`
          # so a failed API call reaches the fail-open branch below instead of
          # aborting the step. Rename sources are included so moving a file out
          # of a gated area still counts as touching it.
          rc=0
          FILES="$(gh api --paginate "/repos/${REPO}/pulls/${PR_NUM}/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)')" || rc=$?
          COUNT=$(printf '%s\n' "$FILES" | grep -c . || true)
          if [ "$rc" -ne 0 ] || [ "$COUNT" -eq 0 ] || [ "$COUNT" -ge 3000 ]; then
            echo "::warning::could not obtain a reliable changed-file list (rc=${rc}, count=${COUNT}); running everything (fail open)"
            all_true
            exit 0
          fi
          echo "Changed files (${COUNT}):"
          printf '%s\n' "$FILES" | sort -u | sed 's/^/  /'
          FRONTEND=false; BACKEND=true; E2E_ROUTE_METHODS=false
          if printf '%s\n' "$FILES" | grep -qE '^(frontend/|\.github/workflows/ci\.yml$)'; then
            FRONTEND=true
          fi
          if printf '%s\n' "$FILES" | grep -qE '^(frontend/tests/e2e/|backend/src/farna/api/|scripts/run_check_e2e_route_methods\.py$|\.github/workflows/ci\.yml$|\.pre-commit-config\.yaml$)'; then
            E2E_ROUTE_METHODS=true
          fi
          # backend: false only when everything is under frontend/ or docs.
          NON_BACKEND_FREE=$(printf '%s\n' "$FILES" | awk 'NF && !/^frontend\// && !/\.mdx?$/ && (/^docs\/api\/examples\// || !/^docs\//)' | wc -l)
          if [ "$NON_BACKEND_FREE" -eq 0 ]; then
            BACKEND=false
          fi
          {
            echo "frontend=${FRONTEND}"
            echo "backend=${BACKEND}"
            echo "e2e_route_methods=${E2E_ROUTE_METHODS}"
          } >> "$GITHUB_OUTPUT"
          echo "frontend=${FRONTEND} backend=${BACKEND} e2e_route_methods=${E2E_ROUTE_METHODS}"

  backend-lint:
    name: Lint (Backend)
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.12"
          enable-cache: true
      - run: bash ../scripts/uv_sync_with_retry.sh --frozen  # NOSONAR githubactions:S8541: backend lockfile pins source-archive deps (pytest-bdd, ibm-cos-sdk); --frozen pins exact revisions so builds are deterministic.
      - run: uv run --no-build --no-sync ruff check .
      - name: Ruff format check
        run: uv run --no-build --no-sync ruff format --check .
      - run: uv run --no-build --no-sync mypy src/farna/
      - run: uv run --no-build --no-sync bandit -r src/farna/ -ll
      - name: Vulture (block new dead code)
        # BLOCKING: no continue-on-error, no `|| true`. The repo-root
        # .vulture_whitelist.py (framework-contract + test-referenced symbols)
        # is the only sanctioned dead-code escape hatch; anything else fails CI.
        # At --min-confidence 60 unused functions/methods/classes block (see
        # scripts/run_vulture.py for the full finding-type semantics).
        working-directory: .
        run: uv run --no-build --project backend --no-sync python scripts/run_vulture.py
      - name: Semgrep (block new findings)
        # --timeout 120 matches the budget scripts/run_semgrep.py already uses
        # locally; semgrep's default is 5s, which the ~13k-line graph-write
        # files can exceed under CI CPU contention (measured on the pinned
        # semgrep: 28/32 runs skipped at the 5s default vs 0/48 at 120s).
        # --timeout-threshold 1 drops a file on its FIRST per-rule timeout so
        # the worst case stays bounded at 1 x 120s.
        # When a rule times out on a file, semgrep SKIPS that file and still
        # exits 0, printing only "Warning: N timeout error(s) ...". So this
        # step captures the scan output and fails CLOSED when a skipped-file
        # timeout is reported — otherwise the gate can report green while
        # having silently not run a rule against the very file it protects
        # (mcp_server.py holds the only MCP replace_pipeline_graph call site).
        # Detection is PRIMARY from the structured --json-output errors stream
        # (an entry of type "Timeout"); the text signatures are a SECONDARY net
        # and are ANCHORED to semgrep's own line prefixes, so a finding that
        # merely quotes the phrase (pipelines.py contains the literal
        # "dispatch.wait_timeout error") cannot false-trigger. We deliberately
        # do NOT fail on "Partially analyzed". On THIS step's invocation
        # (uv run --project backend --no-sync semgrep) the one reproducible
        # per-file instance is backend/src/farna/api/mcp_server.py:2111 (the
        # PEP 695 generic `async def _run_db_shell[**TOOL_SHELL_P]`, a genuine
        # 1-line skip), so matching it would make CI permanently red. Semgrep's
        # aggregate partial-analysis summary is not stable across invocations /
        # entry points — an earlier scan through a different semgrep binary
        # named node_runner.py and several frontend .spec.ts files, which
        # per-file scans with this invocation did not reproduce. The per-file
        # scan is the authoritative signal. The HITL graph-write guard's region
        # at mcp_server.py:4014 is nonetheless analyzed despite the line-2111
        # skip (mutation-verified, FAR-1933).
        # `--error` semantics are unchanged: the step still propagates semgrep's
        # own exit code for real findings.
        working-directory: .
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            baseline="origin/$GITHUB_BASE_REF"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            baseline="HEAD^"
          else
            baseline=""
          fi
          SEMGREP_LOG=/tmp/semgrep-scan.log
          SEMGREP_JSON=/tmp/semgrep-scan.json
          set +e
          if [ -n "$baseline" ]; then
            uv run --no-build --project backend --no-sync semgrep --config=.semgrep/ --baseline-commit "$baseline" --error --timeout 120 --timeout-threshold 1 --json-output="$SEMGREP_JSON" . 2>&1 | tee "$SEMGREP_LOG"
          else
            uv run --no-build --project backend --no-sync semgrep --config=.semgrep/ --error --timeout 120 --timeout-threshold 1 --json-output="$SEMGREP_JSON" . 2>&1 | tee "$SEMGREP_LOG"
          fi
          rc=${PIPESTATUS[0]}
          incomplete=0
          # PRIMARY: the structured JSON error stream — a skipped file is an
          # errors[] entry of type "Timeout". A missing/malformed payload exits
          # non-zero here and falls through to the text net below.
          if uv run --no-build --project backend --no-sync python - "$SEMGREP_JSON" <<'PY'
          import json, sys
          try:
              payload = json.load(open(sys.argv[1], encoding="utf-8"))
          except (OSError, ValueError):
              sys.exit(1)
          errors = payload.get("errors") if isinstance(payload, dict) else None
          sys.exit(0 if isinstance(errors, list) and any(isinstance(e, dict) and e.get("type") == "Timeout" for e in errors) else 1)
          PY
          then
            incomplete=1
          fi
          # SECONDARY net: anchored to semgrep's own line prefixes.
          if grep -Eq '^Warning: [0-9]+ timeout error|^Semgrep stopped running rules' "$SEMGREP_LOG"; then
            incomplete=1
          fi
          set -e
          if [ "$incomplete" -ne 0 ]; then
            echo "::error::semgrep skipped one or more files after a per-rule timeout; the scan is incomplete and must not be treated as passing (FAR-1859)."
            exit 1
          fi
          exit "$rc"
      - name: Semgrep rule tests (--test)
        # Exercise the rule fixture tree so a rule's `# ruleid` / `# ok` guards
        # actually enforce the intended match. The directory form (`--test
        # .semgrep/`) is dead on this semgrep version for a dot-prefixed config
        # dir (get_config_filenames drops configs whose parent starts with `.`),
        # so pair each rule with its fixture EXPLICITLY. The fixture filename
        # cannot be derived from the rule-file stem in general: two rules here
        # are named after the rule id (`graph-write-missing-is-privileged.py`)
        # or the rule-file stem plus a suffix
        # (`hitl-review-mcp-caller-type-literal.py`, whose rule id is
        # `hitl-gate-mcp-caller-type-literal`) — a stem-derived loop silently
        # skipped them. A listed rule with no fixture is a HARD failure: a
        # missing fixture must fail the gate, never skip silently. `set -e`
        # aborts the step (red CI) if any fixture fails to match.
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          # Every fixture in the repo carrying a semgrep test annotation
          # (`# ruleid:` / `# ok:`) is exercised here (FAR-1933), paired to the
          # rule FILE that contains its rule id. Pairing is by RULE ID, not by
          # rule-file stem (see the step comment above): a stem-derived loop is
          # how a dead rule can ship green for months. Most fixtures live under
          # .semgrep/tests/, but two sit BESIDE their rule files
          # (credential_in_state.py, missing_session_begin.py) — a sweep scoped
          # to .semgrep/tests/*.py is exactly what missed them, so enumerate by
          # annotation, not by directory:
          #   grep -rl '# ruleid:' --include='*.py' --include='*.ts' \
          #     --include='*.vue' --include='*.js' .
          pairs="
          .semgrep/all-empty-iterable.yml:.semgrep/tests/all-empty-iterable.py
          .semgrep/asyncio_waitfor_wait_unshielded.yml:.semgrep/tests/asyncio-waitfor-wait-unshielded.py
          .semgrep/callable-dunder-name.yml:.semgrep/tests/callable-dunder-name.py
          .semgrep/connector-egress-verify-required.yml:.semgrep/tests/connector-egress-verify-required.py
          .semgrep/credential_in_state.yml:.semgrep/credential_in_state.py
          .semgrep/exception-mro-ordering.yml:.semgrep/tests/test_exception_mro_ordering.py
          .semgrep/hitl-review-edge-mutation-outside-guard.yml:.semgrep/tests/hitl-review-edge-mutation-outside-guard.py
          .semgrep/hitl-review-mcp-caller-type.yml:.semgrep/tests/hitl-review-mcp-caller-type-literal.py
          .semgrep/mcp-human-only-constant-non-browser.yml:.semgrep/tests/mcp-human-only-constant-non-browser.py
          .semgrep/missing-is-privileged.yml:.semgrep/tests/graph-write-missing-is-privileged.py
          .semgrep/missing_session_begin.yml:.semgrep/missing_session_begin.py
          .semgrep/no-op-except-reraise.yml:.semgrep/tests/no-op-except-reraise.py
          .semgrep/no-raw-httpx-client.yml:.semgrep/tests/no-raw-httpx-client.py
          .semgrep/non_serializable_in_langgraph_state.yml:.semgrep/tests/non-serializable-in-langgraph-state.py
          .semgrep/retry-loop-last-exc.yml:.semgrep/tests/retry-loop-last-exc.py
          "
          for pair in $pairs; do
            rule="${pair%%:*}"
            fixture="${pair#*:}"
            if [ ! -f "$rule" ]; then
              echo "::error::semgrep rule test: rule file not found: $rule"
              exit 1
            fi
            if [ ! -f "$fixture" ]; then
              echo "::error::semgrep rule test: missing fixture for $rule (expected $fixture) — a rule with no fixture is a failure, not a skip"
              exit 1
            fi
            uv run --no-build --project backend --no-sync semgrep --config="$rule" --test "$fixture"
          done
      - name: pip-audit (bounded retry on transient PyPI service errors)
        # pip-audit's PyPI vulnerability service raises ServiceError on any
        # non-404 HTTP error (pip_audit/_service/pypi.py: `raise ServiceError
        # from http_error`), so a transient `503 Server Error: Backend is
        # unhealthy` from pypi.org fails this required check outright — observed
        # on main at 675eac3b. Retry ONLY when the log shows that transient
        # signature (or a PyPI connection error), never when pip-audit reports
        # actual vulnerabilities, so a genuine finding is never masked. Mirrors
        # the signature-gated retry used for the SonarCloud scan below.
        # The signature list must include socket read/connect timeouts — a plain
        # `Read timed out` / `ReadTimeout` to pypi.org is the most common
        # transient failure and, when absent, was misread as "non-transient
        # error" and failed the check without retrying (observed on main at
        # 71a55aab0 in deploy.yml's mirror of this gate).
        run: |
          set -uo pipefail
          LOG="$(mktemp)"
          trap 'rm -f "$LOG"' EXIT
          for attempt in 1 2 3; do
            : > "$LOG"
            set +e
            # GHSA-53pm-wgxf-c6qf: dev-only ReDoS in wcmatch (pulled in by semgrep). It
            # never ships to production (`uv sync --no-dev` in the Dockerfile) and semgrep
            # pins `wcmatch~=8.3`, so the fixed 11.2 cannot be installed. Reviewed exception
            # documented in docs/security/dependency-policy.md (Approved CVE Override List).
            uv run --no-build --no-sync pip-audit --ignore-vuln GHSA-53pm-wgxf-c6qf 2>&1 | tee "$LOG"
            RC=${PIPESTATUS[0]}
            set -e
            if [ "$RC" -eq 0 ]; then
              echo "::notice::pip-audit succeeded on attempt ${attempt}/3."
              exit 0
            fi
            if grep -qE "pip_audit\._service\.interface\.(ServiceError|ConnectionError)|[0-9]{3} Server Error|Backend is unhealthy|Could not connect to PyPI|PyPI is not redirecting properly|Read timed out|ReadTimeout|ConnectTimeout|Connection timed out|Max retries exceeded|HTTPSConnectionPool\(host='pypi\.org'" "$LOG"; then
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::pip-audit hit a transient PyPI service error (attempt ${attempt}/3); retrying."
                sleep $((attempt * 10))
              else
                echo "::warning::pip-audit hit a transient PyPI service error on the final attempt (3/3); not retrying."
              fi
              continue
            fi
            echo "::error::pip-audit failed with a non-transient error or found vulnerabilities; not retrying."
            exit "$RC"
          done
          echo "::error::pip-audit still hit a transient PyPI service error after 3 attempts."
          exit 1
      - name: Import-linter architecture contracts
        run: uv run --no-build --no-sync lint-imports
      - name: Validate sidebar nav translations
        working-directory: .
        run: uv run --no-build --project backend --no-sync python scripts/run_validate_translations.py
      - name: Validate manifest nav structure
        working-directory: .
        run: uv run --no-build --project backend --no-sync python scripts/run_validate_nav_config.py
      - name: Validate canonical frontend graph writes
        # Keep this beside the backend structural gates: the checker is
        # dependency-free and validates the frontend's graph write contract.
        working-directory: .
        run: uv run --no-build --project backend --no-sync python scripts/run_validate_graph_schema.py
      - name: Product map consistency (declared data-testids)
        # BLOCKING, deliberately in the fast lint job rather than only in the
        # full-suite run. The test file itself only reads manifest.yaml, the
        # router and .vue sources (no app imports), but pytest loads
        # tests/conftest.py which pulls app modules - ~35s cold on Windows,
        # ~5-10s in CI Linux. merge-validate.yml still runs it as part of its
        # architecture suite, but that runs once per train, so leaving it ONLY
        # there meant a PR that adds a static data-testid without declaring it
        # in the manifest went red a train cycle later and the Branch Fixer
        # patched the manifest. The fast tier keeps the immediate feedback.
        run: uv run --no-build --no-sync python -m pytest tests/architecture/test_product_map_consistency.py -q --tb=short -W "error::pytest.PytestUnraisableExceptionWarning" --disable-warnings
      - name: Behaviour bindings (FAR-2701)
        # BLOCKING, and deliberately here beside the product-map consistency
        # check rather than only in merge-validate.yml's non-unit suites. The
        # train ignores it until a cycle later, so an unbound ticked behaviour
        # added in a product-map edit would stay green on the PR and only be
        # caught after the batch was composed. Reading the product map, the
        # manifest and the test tree is all it does; no app imports of note.
        run: uv run --no-build --no-sync python -m pytest tests/architecture/test_behaviour_bindings.py -q --tb=short -W "error::pytest.PytestUnraisableExceptionWarning" --disable-warnings
      - name: Behaviour-bindings baseline may only shrink (FAR-2701)
        # The baseline test itself catches an entry that has since become bound
        # (the accidental case). This catches the deliberate one: unbinding a
        # product-map behaviour and freezing it in the same change. The baseline
        # is a shrink-only ratchet (like the FAR-2699 group), so an ADDED id is a
        # loosening.
        #
        # It also catches DELETION: removing a behaviour together with its marker
        # leaves no trace in the entries, the weak ratchet or the fingerprint
        # index, so every other bindings test stayed green while a documented
        # behaviour vanished. The behaviour id set is compared against the base
        # revision, and a REMOVED id fails unless it is listed in the baseline's
        # `approved_removals` (the explicit exemption for an intended removal).
        #
        # PR-only: the base revision is the PR's base commit, which is always
        # resolvable here.
        if: github.event_name == 'pull_request'
        working-directory: .
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uv run --no-build --project backend --no-sync python scripts/run_behaviour_bindings_baseline.py --check-base "$BASE_SHA"
      - name: Trivy filesystem scan (dependency CVEs + misconfigs)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        # Pin the vulnerability DB to the canonical GHCR repository instead of
        # relying on Trivy's default priority list
        # [mirror.gcr.io/aquasec/trivy-db:2, ghcr.io/aquasecurity/trivy-db:2].
        # The GCR mirror intermittently serves a 404 on the artifact layer
        # (`unexpected status code 404 Not Found`), and Trivy's
        # shouldTryOtherRepo() only falls through to the next repository on a
        # transport error (TOOMANYREQUESTS) or BLOB_UNKNOWN - a plain 404 is
        # neither, so it aborts on the first repo and never tries ghcr.io,
        # failing this required check on a transient mirror outage (observed
        # on PR #1253 head 8dbed89f: job 111383553258; again on PR #1549 head
        # 3a96e5bbb: job 114344664013).
        #
        # The repository MUST be set via Trivy's own TRIVY_DB_REPOSITORY env
        # var, which this action passes through to the trivy CLI it invokes.
        # The previous `db-repository:` *action input* is NOT a declared input
        # of aquasecurity/trivy-action (absent from this pinned SHA and from
        # v0.36.0), so GitHub silently ignored it ("Unexpected input(s)
        # 'db-repository'") and the flaky mirror stayed on the critical path.
        env:
          TRIVY_DB_REPOSITORY: 'ghcr.io/aquasecurity/trivy-db:2'
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          format: 'table'
          skip-dirs: '**/.venv,**/node_modules,**/.git,**/.agents,**/.pytest_cache,**/dist,**/build'

  uv-lock-check:
    # FAR-2308: backend/uv.lock records the project version and the resolved
    # dependency set. `uv sync --frozen` (used by every other job) installs from
    # the lock as-is and cannot see that it has drifted from
    # backend/pyproject.toml, so a stale lock reached main unnoticed and every
    # `uv run` in a local commit gate rewrote the lock mid-run, colliding with
    # pre-commit's stash/restore and aborting pushes from any branch based on
    # the stale tree. This job is deliberately NOT path-gated: a stale lock on
    # main must fail an unrelated PR too, because that is exactly how the drift
    # propagates. `uv lock --check` never writes the lockfile, and the gate
    # fails closed if it cannot run.
    name: UV lockfile freshness
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Check backend/uv.lock is in sync with backend/pyproject.toml
        run: uv lock --check

  backend-affected-tests:
    # The PR-tier backend test gate: the test files the change actually touches,
    # selected by scripts/run_affected_tests.py (changed test modules plus
    # candidate test modules for changed source modules). This is NOT a unit
    # shard and NOT the full suite - the full suite is the merge train's job,
    # validated once on the composed branch by merge-validate.yml.
    #
    # Why it exists here: unit tests catch a broken import or a changed contract
    # in seconds, and a PR that never runs one at all waits a whole train cycle
    # to find out. Why it is bounded: a mass rename must not turn the fast tier
    # into a suite run, so the selection is capped (--max-files) and the
    # --prepush profile adds the per-suite wall bound AND defers the suites that
    # need infrastructure this job does not provide (integration/docker stand up
    # their own Postgres/testcontainers, e2e needs browsers + a running app, bdd
    # is browser/live-app, load is not a correctness gate). Without --prepush an
    # affected integration/docker test would run here with none of that setup
    # and only the job timeout as a backstop. Every deferred suite is printed as
    # "deferred to CI" (never silently skipped) and the train runs everything.
    #
    # `!= 'false'` (not `== 'true'`) is the fail-open form used throughout this
    # workflow: an absent or unparseable output must RUN the gate, never skip it.
    name: Test (Backend) affected
    needs: [current-head-gate, changes]
    if: needs.current-head-gate.outputs.current == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the merge base with the PR's base branch resolves:
          # the selector diffs <merge-base>...HEAD.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        if: needs.changes.outputs.backend != 'false'
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync backend dependencies
        if: needs.changes.outputs.backend != 'false'
        working-directory: backend
        run: bash ../scripts/uv_sync_with_retry.sh --frozen  # NOSONAR githubactions:S8541: backend lockfile pins source-archive deps (pytest-bdd, ibm-cos-sdk); --frozen pins exact revisions so builds are deterministic.
      - name: Run tests affected by the changed files
        if: needs.changes.outputs.backend != 'false'
        shell: bash
        env:
          # `base_ref` is only set on pull_request; a dispatch has no base, so
          # compare against the tip's parent (the selector falls back the same
          # way, and never to the full suite).
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A pull_request checkout is the GitHub merge commit, whose first
          # parent IS the base branch tip, so `HEAD^` is a correct comparison
          # base when the base branch's remote-tracking ref is not present
          # locally. Prefer origin/<base> when it resolves (a wider diff if the
          # branch moved), otherwise fall back deterministically - never to the
          # full suite.
          if [ "$EVENT_NAME" = "pull_request" ] \
             && git rev-parse --verify --quiet "origin/${BASE_REF}" >/dev/null; then
            BASE="origin/${BASE_REF}"
          else
            BASE="HEAD^"
          fi
          echo "Selecting affected tests against ${BASE}."
          # The selector runs its pytest children from backend/ itself, so this
          # driver is invoked from the repository root with --project backend.
          uv run --no-build --project backend --no-sync \
            python scripts/run_affected_tests.py \
            --prepush --base "$BASE" --max-files 80 --time-budget-seconds 600

  frontend-lint:
    # The PR-tier frontend gate: ESLint and vue-tsc only. Everything else the
    # frontend needs (vitest with coverage, WCAG contrast, the production build)
    # runs in merge-validate.yml on the composed train branch.
    #
    # The type-check is the expensive half (~1 min) and the lint ~25 s, both
    # measured on ubicloud-standard-2; the dependency install is cached.
    name: Frontend lint and type-check
    needs: [current-head-gate, changes]
    if: needs.current-head-gate.outputs.current == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.frontend == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: needs.changes.outputs.frontend == 'true'
        with:
          version: 11.29.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: needs.changes.outputs.frontend == 'true'
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
        if: needs.changes.outputs.frontend == 'true'
      - run: pnpm run lint
        if: needs.changes.outputs.frontend == 'true'
      - run: pnpm run type-check
        if: needs.changes.outputs.frontend == 'true'

  schema-freshness:
    # Regenerates frontend/src/lib/api/schema.ts from the backend's OpenAPI and
    # FAILS if the committed schema differs from what the generator produces.
    # Any backend API change (routes, request/response models) therefore forces
    # `pnpm run generate:api` in the same PR. Mirrors scripts/run_generate_api_types.py:
    # dump the OpenAPI JSON by importing farna.api.main, then feed it to
    # openapi-typescript. Runs on ALL events (PR + manual dispatch), and keeps
    # its exact job name: release-unified.yml refuses to tag unless a run of
    # this workflow on the exact target commit contains a green job NAMED
    # "Schema freshness", and scripts/run_release_preflight.py resolves the same
    # name through the jobs API. Never rename it, never make it job-level
    # conditional (a SKIPPED job blocks the release as hard as a failing one).
    name: Schema freshness
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.29.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install backend deps
        working-directory: backend
        run: bash ../scripts/uv_sync_with_retry.sh --frozen  # NOSONAR githubactions:S8541: backend lockfile pins source-archive deps (pytest-bdd, ibm-cos-sdk); --frozen pins exact revisions so builds are deterministic.
      - name: Dump OpenAPI schema from backend
        working-directory: backend
        shell: bash
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./modulo-gen-test.db"
          # SQLite is the test/tooling backend only (ADR 068): Settings refuses a
          # SQLite DSN unless BOTH halves of the test-only opt-in are set.
          FARNA_CONTROL_DB: "sqlite"
          FARNA_CONTROL_ALLOW_SQLITE: "1"
          SECRET_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          FERNET_KEY: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          FARNA_CONTROL_CSRF_ENABLED: "false"
        run: |
          cat > /tmp/gen_openapi.py <<'EOF'
          import os, json, sys
          sys.tracebacklimit = 0
          from farna.api.main import app
          with open("/tmp/modulo_openapi.json", "w", encoding="utf-8") as f:
              json.dump(app.openapi(), f, ensure_ascii=False)
          print(f"Schema: {os.path.getsize('/tmp/modulo_openapi.json')} bytes")
          EOF
          uv run --no-build --no-sync python /tmp/gen_openapi.py
      - name: Generate TypeScript types
        # Pin the openapi-typescript version to the one in frontend/package.json
        # (7.13.0) so the gate is deterministic — a bare `pnpm dlx openapi-typescript`
        # would pull the latest release and cause version-skew churn between local
        # (`pnpm run generate:api`, uses the lockfile install) and CI.
        working-directory: frontend
        shell: bash
        run: pnpm dlx openapi-typescript@7.13.0 /tmp/modulo_openapi.json --output src/lib/api/schema.ts
      - name: Fail if schema.ts is stale
        shell: bash
        run: |
          if git diff --exit-code -- frontend/src/lib/api/schema.ts; then
            echo "schema.ts is up to date"
          else
            echo "::error::frontend/src/lib/api/schema.ts is stale. Run 'pnpm run generate:api' from frontend/ and commit the regenerated file."
            exit 1
          fi

  gitleaks:
    name: Secret scan
    runs-on: ubicloud-standard-2
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The SARIF artifact upload hits a 403 from the runner's blob-storage
          # proxy in this environment, which fails the whole job even when no
          # leaks are found. The scan itself still runs and reports; we just
          # skip the (non-essential) artifact upload that returns Forbidden.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  copy-consistency:
    name: Copy consistency
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Self-test the checker
        run: python scripts/copy_consistency.py --self-test
      - name: Customer copy
        run: python scripts/copy_consistency.py --customer-copy README.md CONTRIBUTING.md SECURITY.md

  migration-heads-check:
    name: Check migration heads
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync backend dependencies
        working-directory: backend
        shell: bash
        run: bash ../scripts/uv_sync_with_retry.sh --frozen  # NOSONAR githubactions:S8541: backend lockfile pins source-archive deps (pytest-bdd, ibm-cos-sdk); --frozen pins exact revisions so builds are deterministic.
      - name: Verify single migration head
        working-directory: backend
        shell: bash
        run: |
          uv run --no-build --no-sync python -m alembic heads 2>&1 | tee /tmp/alembic_heads.txt
          HEAD_COUNT=$(grep -c "\(head\)\|\(effective head\)" /tmp/alembic_heads.txt || true)
          if [ "$HEAD_COUNT" -ne 1 ]; then
            echo "::error::Alembic migration graph has $HEAD_COUNT heads (expected 1). Create a merge migration."
            exit 1
          fi
          echo "Migration heads OK ($HEAD_COUNT head)"

      # Numeric-prefix collision check vs base. `alembic heads` above catches TWO
      # head migrations, but NOT a numeric-prefix collision: two migrations that
      # both use prefix 0065_ (e.g. the PR's 0065_cost_components + main's
      # 0065_reconcile_staging_schema) that are manually chained (one's
      # down_revision is the other) produce a single head, so the multi-head check
      # can't see the collision. We hit exactly this on PR #671 (A1); it was caught
      # only because the two files were separate heads. Fail early here instead.
      - name: Check numeric migration-prefix collisions vs base
        if: github.event_name == 'pull_request'
        working-directory: backend
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          MIG_DIR="src/farna/db/migrations/versions"
          BASE="origin/$BASE_REF"

          # Migration files changed by this PR vs its merge-base.
          CHANGED=$(git diff --name-only "${BASE}...HEAD" -- "${MIG_DIR}/" || true)
          if [ -z "$CHANGED" ]; then
            echo "No migration files changed by this PR -- skipping migration-prefix collision check"
            exit 0
          fi

          # All migration filenames on the base (main) side.
          BASE_FILES=$(git ls-tree --name-only "${BASE}" "${MIG_DIR}/" | sed 's|.*/||' || true)

          echo "Migration files changed by this PR:"
          printf '%s\n' "$CHANGED" | sed 's/^/  /'
          echo ""

          COLLISION=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # Skip deletions/renamed-away files: only files still present in the
            # PR tree can collide after merge.
            if ! git cat-file -e "HEAD:${f}" 2>/dev/null; then
              echo "  (skip) not present in PR tree: ${f}"
              continue
            fi
            base_f=$(basename "$f")
            prefix=$(printf '%s' "$base_f" | cut -d_ -f1)
            while IFS= read -r bf; do
              [ -z "$bf" ] && continue
              bprefix=$(printf '%s' "$bf" | cut -d_ -f1)
              if [ "$bprefix" = "$prefix" ] && [ "$bf" != "$base_f" ]; then
                echo "::error::Numeric migration-prefix collision: ${base_f} collides with ${bf}. Renumber to the next free prefix (e.g. 0066, 0067...) and set down_revision to the actual current head."
                COLLISION=1
              fi
            done <<< "$BASE_FILES"
          done <<< "$CHANGED"

          if [ "$COLLISION" -eq 1 ]; then
            exit 1
          fi
          echo "No migration-prefix collision"
          exit 0

  e2e-route-methods-check:
    if: needs.current-head-gate.outputs.current == 'true'
    needs: [current-head-gate, changes]
    # FAR-1847: deploy-critical structural guard. deploy.yml runs
    # `playwright test --grep "@regression"` against staging before promoting
    # to production, so an E2E caller whose method no longer matches the live
    # route blocks the deploy - and a stale page.route interceptor is worse:
    # it keeps passing while asserting nothing. Imports the backend app under
    # the same template env as schema-freshness (no DB, no network) and
    # matches every method/path pair extracted from frontend/tests/e2e/**
    # against the live route objects (`app.routes`), not the OpenAPI document -
    # it omits `include_in_schema=False` routes and flattens path converters.
    name: E2E route methods
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # FAR-1847: path-gated like the run step below, so a docs-only PR
        # cannot turn this check red on a transient checkout/setup failure.
        if: needs.changes.outputs.e2e_route_methods == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        if: needs.changes.outputs.e2e_route_methods == 'true'
        with:
          python-version: "3.12"
          enable-cache: true
      # The sync is its own step with a plain-scalar `run:` so the NOSONAR
      # comment is a real YAML comment. Inside a `run: |` block scalar it is
      # shell text, which the YAML analyzer cannot read as a suppression, so
      # githubactions:S8541 was still raised against the command line.
      - name: Sync backend dependencies
        if: needs.changes.outputs.e2e_route_methods == 'true'
        working-directory: backend
        shell: bash
        # NOSONAR githubactions:S8541: the backend lockfile pins source-archive
        # deps (pytest-bdd has no wheel, ibm-cos-sdk is sdist-only), so
        # `--no-build` hard-fails this sync on a cold uv cache. `--frozen`
        # pins the exact revisions, so the builds are deterministic and
        # trusted (no untrusted setup scripts execute).
        run: bash ../scripts/uv_sync_with_retry.sh --frozen  # NOSONAR
      - name: Check E2E HTTP calls match live API routes
        # Step-level gate (never job-level): a docs-only PR skips the check
        # while the job still reports success, matching the other path-gated
        # jobs. Every non-PR event runs it (`changes` sets all outputs true).
        if: needs.changes.outputs.e2e_route_methods == 'true'
        working-directory: backend
        shell: bash
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./modulo-e2e-route-check.db"
          SECRET_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          FERNET_KEY: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          FARNA_CONTROL_CSRF_ENABLED: "false"
        run: uv run --no-build --no-sync python ../scripts/run_check_e2e_route_methods.py

  # Break-glass deploy gate = acceptance (b) of the break-glass admin recovery
  # plan sec. 3: automated staging verification = the boot-time allow-list assertion
  # + the connectivity smoke that FAILS boot when ENABLED AND
  # boot-failure-mode=fail. Runs the breakglass_gate-tagged regression suite
  # (test_break_glass_gate.py) against testcontainers Postgres with the
  # PRODUCTION bootstrap_role.py, in BOTH directions (clean config passes, a
  # rogue grant FAILS the assertion) plus the transient-vs-fatal discriminator.
  # Also runs the FAR-190/192 streak-engine SQL suite
  # (test_trigger_streak_engine_sql.py) - the trigger_events vocabulary
  # constraint + deactivation SQL against real Postgres (FAR-192 FIX 3).
  #
  # FAR-2369 (breadth over speed): this is a DEPLOY gate, not a PR gate, so it
  # runs only on workflow_dispatch (the merge queue's post-merge dispatch on
  # main, and release dispatches). On a pull_request every step is skipped at
  # STEP level and the job still reports success (a job-level skip surfaces as a
  # non-green "skipped" check the PR Reviewer flags), so it costs a few seconds
  # of runner allocation on a PR and nothing else. Coverage trade, recorded
  # deliberately: the vocabulary-constraint suite is not exercised per-PR - a
  # break reaches main and is caught by this job on the next dispatch rather
  # than on the PR. The deploy gate's own
  # integration job still runs the same class of Postgres-backed suite before
  # anything is promoted.
  break-glass-deploy-gate:
    if: needs.current-head-gate.outputs.current == 'true'
    needs: [current-head-gate]
    name: Break-glass deploy gate
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        if: github.event_name != 'pull_request'
        with:
          python-version: "3.12"
          enable-cache: true
      - run: bash ../scripts/uv_sync_with_retry.sh --frozen  # NOSONAR githubactions:S8541: backend lockfile pins source-archive deps (pytest-bdd, ibm-cos-sdk); --frozen pins exact revisions so builds are deterministic.
        if: github.event_name != 'pull_request'
      - name: Break-glass boot allow-list + connectivity smoke
        if: github.event_name != 'pull_request'
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        # The default signal method cannot interrupt syscall-blocked tests, so
        # --timeout=300 can never fire before the runner kills the job silently.
        run: uv run --no-build --no-sync pytest tests/integration/test_break_glass_gate.py tests/integration/test_trigger_streak_engine_sql.py -q --tb=short --timeout=300 --timeout-method=thread -W "error::pytest.PytestUnraisableExceptionWarning" --disable-warnings

  notify-pr-failure:
    name: Trigger Branch Fixer
    # The `manual-delivery` label must only suppress the webhook dispatch step
    # below, NOT the whole job: a job-level skip surfaces this check as
    # "skipped" in the check-runs API, which the PR Reviewer flags as a
    # non-green signal on every such PR. The check itself always reports
    # success on pull_request events; the label guard lives on the dispatch
    # step so it keeps its documented meaning ("do not auto-dispatch the
    # Branch Fixer").
    if: github.event_name == 'pull_request' && always()
    # FAR-1429: `needs` must list EVERY job that can fail on a PR, because the
    # guard below reads `needs.*.result` and therefore sees ONLY the jobs named
    # here — a failing job missing from this list never reached the Branch
    # Fixer / reviewer gate. Step-level `failure()` does NOT help: the runner
    # evaluates it from this job's own status alone, so with no failing step in
    # this job it is always false. A job that is merely SKIPPED is neither
    # failure() nor cancelled(); every job here either always runs (path gates
    # are step-level) or is only skipped because an ancestor already failed,
    # which is itself a failure. `copy-consistency` (FAR-2778) is a product job
    # with no `if:`, so it runs - and can fail - on every pull_request and must
    # stay listed here.
    needs: [current-head-gate, changes, backend-lint, uv-lock-check, backend-affected-tests, frontend-lint, schema-freshness, gitleaks, copy-consistency, migration-heads-check, e2e-route-methods-check, break-glass-deploy-gate]
    runs-on: ubicloud-standard-2
    permissions:
      actions: write
      pull-requests: write
      # The checkout below fetches scripts/dispatch_with_retry.sh; job-level
      # permissions replace the workflow-level `contents: read`, so it must be
      # granted explicitly or the checkout fails.
      contents: read
    # Guard predicate below is NEEDS-AWARE, not step-level `failure()`
    # (contains(needs.*.result, 'failure') || cancelled()). Step-level
    # `failure()` sees only THIS job's own previous steps: with every product
    # job listed in `needs` and no failing step within this job, it was ALWAYS
    # false, so the entire guard chain (superseded-check -> retry-check ->
    # queue-check -> dispatch) skipped on every genuine PR CI failure,
    # dead-ending the CI -> Branch Fixer path onto the PR Housekeeper cron.
    # `cancelled()` is retained so a cancelled (superseded) run still reaches
    # the superseded-check guard unchanged. Same needs-aware pattern as
    # notify-main-failure below.
    #
    # The consumers test `steps.retry-check.outputs.exhausted != 'true'`, not
    # `== 'false'`: a skipped/empty output then reads as "not exhausted"
    # rather than silently suppressing the dispatch. The retry-exhausted
    # suppression is preserved — `exhausted=true` still blocks the dispatch,
    # so there is no dispatch loop.
    steps:
      - name: Skip if this run was superseded by a newer push
        id: superseded-check
        if: contains(needs.*.result, 'failure') || cancelled()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FARNA_CONTROL_REVIEWBOT_TOKEN || github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_STATUS: ${{ needs.current-head-gate.outputs.current }}
        run: |
          # FAR-1427: this workflow now cancels in-progress pull_request runs
          # when a newer push lands (workflow-level concurrency). A job with
          # `always()` still run on cancellation, and this job deliberately
          # treats `cancelled()` as a failure, so a superseded (cancelled) run
          # would otherwise dispatch the Branch Fixer - and post the
          # "exhausted" comment - for a STALE head SHA. The newer push has its
          # own run that owns the outcome. Compare this run's head SHA with the
          # PR's current head: if they differ, this run is stale - do nothing.
          # Fail OPEN (treat as current) on any API/parse failure: a genuine
          # CI failure must not be silently dropped on an API blip; the Branch
          # Fixer webhook already coalesces duplicates by (prNumber, headSha).
          if [ "$HEAD_STATUS" = "false" ]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Current-head gate already marked this run superseded; skipping Branch Fixer dispatch."
            exit 0
          fi
          CURRENT_SHA=$(gh api "/repos/${{ github.repository }}/pulls/${PR_NUM}" --jq '.head.sha' 2>/dev/null || echo "")
          if [ -n "$CURRENT_SHA" ] && [ "$CURRENT_SHA" != "$HEAD_SHA" ]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Run is for ${HEAD_SHA} but PR #${PR_NUM} head is now ${CURRENT_SHA} - superseded run, skipping Branch Fixer dispatch."
          else
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check retry limit
        id: retry-check
        if: (contains(needs.*.result, 'failure') || cancelled()) && steps.superseded-check.outputs.superseded != 'true' && !contains(github.event.pull_request.labels.*.name, 'manual-delivery')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FARNA_CONTROL_REVIEWBOT_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # PR_NUM / BRANCH are mapped through the step env block (S7630):
          # GitHub expressions inside a run block are interpolated before the
          # shell parses the script, so untrusted branch-name content could
          # break out into code execution. Via env: they are data, never code.
          # (Same pattern as the "Trigger Farna Control Branch Fixer" step below.)

          # Count how many times the branch fixer has already pushed fix commits
          # to this PR. Each successful fix produces exactly one commit with
          # committer "modulo-branch-fixer".
          FIX_COUNT=$(gh api "/repos/${{ github.repository }}/pulls/${PR_NUM}/commits?per_page=100" \
            --jq '[.[] | select(.commit.committer.name == "modulo-branch-fixer")] | length' 2>/dev/null || echo "0")

          echo "fix_attempts=$FIX_COUNT" >> "$GITHUB_OUTPUT"
          echo "PR #${PR_NUM} on '${BRANCH}' -- branch fixer has pushed $FIX_COUNT fix commit(s)."

          if [ "$FIX_COUNT" -ge 3 ]; then
            echo "exhausted=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Branch fixer exhausted after $FIX_COUNT attempts against PR #${PR_NUM}."
            # FAR-1997: this job is dispatch-only — it has NO actions/checkout
            # step — so `gh` cannot infer the repository from a git remote and
            # an unqualified `gh pr comment` dies with "fatal: not a git
            # repository" before reaching the API. Pass the repository
            # explicitly. (Same fix, same class, as the dispatch-failure notice
            # below.)
            gh pr comment "$PR_NUM" --repo "$REPO" --body "## Branch Fixer Exhausted

            The automated branch fixer has attempted $FIX_COUNT fixes against this PR but CI is still failing. Manual intervention is required.

            The branch fixer will not retry again on this PR."
          else
            echo "exhausted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if a merge-queue run is already in flight for this PR
        id: queue-check
        if: (contains(needs.*.result, 'failure') || cancelled()) && steps.superseded-check.outputs.superseded != 'true' && steps.retry-check.outputs.exhausted != 'true' && !contains(github.event.pull_request.labels.*.name, 'manual-delivery')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FARNA_CONTROL_REVIEWBOT_TOKEN || github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          # A green CI run entered the merge queue, and then a THIRD-PARTY PR's
          # merge (or a review event) advanced main and cancelled this PR's
          # now-stale queue run. That cancellation surfaces as
          # (contains(needs.*.result, 'failure') || cancelled()) here and
          # dispatches a Branch Fixer run
          # even though nothing is broken and the queue is already re-running
          # this branch. If a merge-queue run for this PR is still in flight,
          # the queue owns the outcome — do not dispatch a competing fixer run.
          #
          # How a queue run is associated with THIS PR (verified against the
          # Actions API): since FAR-1428 the queue runs only on schedule /
          # workflow_dispatch / repository_dispatch, all of which run on main
          # (head_branch 'main', prs []), so this guard now matches only legacy
          # review/check_suite-triggered runs still in flight and is otherwise
          # a harmless no-op; it is kept (fail-closed) rather than deleted. We
          # match on head branch, head SHA, OR the run's associated PR - never
          # on event. A run that has not finished is reported by the
          # Actions API as `queued`, `in_progress`, `pending`, `requested` or
          # `waiting` — observed live: the in-flight Merge: Queue run for this
          # very PR reports status "pending", NOT "queued"/"in_progress", so
          # keying on those two alone silently misses it. The only terminal run
          # status is `completed` (cancelled/skipped/failed runs are all
          # status "completed" with a distinct conclusion), so we treat ANY
          # non-completed status as in flight. The queue's concurrency group is
          # FIFO (cancel-in-progress: false), so a fixer racing a still-queued
          # run is exactly the race this guard must lose.
          #
          # Fail CLOSED on any query/parse failure: the old `|| echo 0`
          # converted an API/jq blip into "no queue run in flight" and re-
          # dispatched the fixer against a live queue run — silently
          # reintroducing the bug this guard exists to fix.
          if ! RUNS_JSON=$(gh api \
            "/repos/${{ github.repository }}/actions/workflows/merge-queue.yml/runs?per_page=100" \
            2>/dev/null); then
            echo "queue_in_flight=true" >> "$GITHUB_OUTPUT"
            echo "::error::Could not query 'Merge: Queue' runs (GitHub API error) — failing CLOSED and skipping Branch Fixer dispatch to avoid racing the queue."
            exit 0
          fi
          IN_FLIGHT=$(printf '%s' "$RUNS_JSON" | jq \
            --arg branch "${BRANCH}" \
            --arg sha "${HEAD_SHA}" \
            --argjson pr "${PR_NUM:-0}" \
            '[ .workflow_runs[]
               | select(.status != "completed")
               | select(
                   .head_branch == $branch
                   or .head_sha == $sha
                   or ([.pull_requests[]?.number] | index($pr) != null)
                 )
             ] | length' 2>/dev/null) || IN_FLIGHT=""
          if [ -z "$IN_FLIGHT" ]; then
            echo "queue_in_flight=true" >> "$GITHUB_OUTPUT"
            echo "::error::Could not parse 'Merge: Queue' runs (jq failed) — failing CLOSED and skipping Branch Fixer dispatch to avoid racing the queue."
            exit 0
          fi
          if [ "$IN_FLIGHT" -gt 0 ]; then
            echo "queue_in_flight=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Merge queue run already in flight for PR #${PR_NUM} ('${BRANCH}') — skipping Branch Fixer dispatch (queue owns the outcome)."
          else
            echo "queue_in_flight=false" >> "$GITHUB_OUTPUT"
          fi

      # FAR-1843 D3 was a Branch Fixer in-flight cap in this job (counting
      # actions/workflows/branch-fixer.yml/runs against BRANCH_FIXER_CAP=5);
      # removed after pre-PR review (F1). It could not bound what it claimed:
      # notify-pr-failure dispatches the Branch Fixer by DIRECT WEBHOOK POST
      # to FARNA_CONTROL_BRANCH_FIXER_WEBHOOK_URL, which creates ZERO
      # branch-fixer.yml runs (branch-fixer.yml is a workflow_dispatch-only
      # wrapper that POSTs the same webhook; its runs are produced only by
      # app-side / devtools dispatches). The counter therefore read ~0 during
      # the very storm it was meant to bound, and its read-then-dispatch
      # TOCTOU across ~28 concurrent ci jobs could not bound anything anyway.
      # A GitHub-side counter cannot reliably bound an app-side resource — a
      # cap that does not bound the thing it claims to is worse than no cap:
      # it looks like protection while providing none. Do not re-add one here.
      #
      # The real bound lives APP-SIDE, enforced atomically at run-creation
      # time: the Branch Fixer pipeline's own concurrency on control.farna.dev —
      # pipeline id 6bdf5fca-1b29-4ad2-a273-2b3684e97348 — via its
      # max_concurrent_runs and its webhook trigger's max_concurrent_runs
      # (follow-up tracked separately; FAR-1843). The dispatch guards that
      # remain below — superseded-run, exhausted, queue-check,
      # manual-delivery — are unaffected and still suppress stale, duplicate
      # and hand-managed dispatches.

      # The dispatch policy is shared code (scripts/dispatch_with_retry.sh), so
      # this job needs a checkout of exactly that one file. It carries the SAME
      # guard as the dispatch step on purpose: the job runs on every PR, and an
      # unconditional checkout would give the "Trigger Branch Fixer" check a
      # failure mode (checkout error) even when every guard below suppresses
      # the dispatch and CI is green.
      - name: Check out the dispatch script
        if: (contains(needs.*.result, 'failure') || cancelled()) && steps.superseded-check.outputs.superseded != 'true' && steps.retry-check.outputs.exhausted != 'true' && steps.queue-check.outputs.queue_in_flight != 'true' && !contains(github.event.pull_request.labels.*.name, 'manual-delivery')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Trigger Farna Control Branch Fixer
        if: (contains(needs.*.result, 'failure') || cancelled()) && steps.superseded-check.outputs.superseded != 'true' && steps.retry-check.outputs.exhausted != 'true' && steps.queue-check.outputs.queue_in_flight != 'true' && !contains(github.event.pull_request.labels.*.name, 'manual-delivery')
        env:
          GH_TOKEN: ${{ secrets.FARNA_CONTROL_REVIEWBOT_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUM: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DISPATCH_URL: ${{ secrets.FARNA_CONTROL_BRANCH_FIXER_WEBHOOK_URL }}
          DISPATCH_SECRET: ${{ secrets.FARNA_CONTROL_BRANCH_FIXER_HMAC_SECRET }}
          DISPATCH_LABEL: "Farna Control Branch Fixer"
        shell: bash
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # jq -n --arg/--argjson JSON-escapes every value, so a crafted branch
          # name (legal in git refnames, e.g. containing '"') cannot inject
          # keys or break the payload. See FAR-568.
          #
          # headSha (FAR-1034): the Branch Fixer's webhook trigger coalesces
          # repeated CI-failure events by (prNumber, headSha), so the payload
          # MUST carry the failing commit's head SHA. Without it the modulo
          # side could not distinguish a duplicate event (same commit still
          # failing) from a genuinely new failure (new commit), and every
          # event launched a separate full fixer run.
          #
          # fingerprint: the same stable failure identity the Branch Fixer
          # embeds in a fix PR body and matches on at run start, so it must be
          # DETERMINISTIC rather than composed by the model (prose drifts
          # between runs and let two runs raise two PRs for the same failure).
          # Shape: <workflow>|<failed PR or main>|<head sha>. Mirrors the
          # payload key deploy.yml sends (PR #1126).
          FINGERPRINT="CI: Fast Validation|pr:${PR_NUM}|${HEAD_SHA}"
          BODY=$(jq -n \
            --arg branchName "${BRANCH}" \
            --argjson prNumber "${PR_NUM}" \
            --arg headSha "${HEAD_SHA}" \
            --arg runUrl "${RUN_URL}" \
            --arg failureDescription "CI checks failed on PR #${PR_NUM} (branch: ${BRANCH})" \
            --arg fingerprint "${FINGERPRINT}" \
            '{branchName: $branchName, prNumber: $prNumber, headSha: $headSha, runUrl: $runUrl, failureDescription: $failureDescription, fingerprint: $fingerprint}')
          echo "PR #${PR_NUM} on branch '${BRANCH}' -- CI checks failed."
          echo "Sending to Farna Control Branch Fixer pipeline..."
          # ONE shared retry policy: scripts/dispatch_with_retry.sh. It is the
          # single definition of the classification (429 = capacity saturation,
          # 000/502/503/504 = transient, every other non-2xx = terminal), the
          # bounded retry (attempt cap AND a 300s wall-clock budget),
          # Retry-After handling and exponential backoff with jitter - so this
          # step no longer carries a second copy that can silently diverge from
          # its sibling. On an undelivered dispatch the script emits its own
          # class-named ::error:: and a durable run summary; the failure arm
          # below adds what only this job knows (the PR it concerns, and the
          # exit-code contract).
          #
          # The bound itself (attempt cap + 300s wall-clock budget) lives in
          # the script. To override it, set DISPATCH_BUDGET_SECONDS /
          # DISPATCH_MAX_ATTEMPTS in the workflow environment — both the script
          # and this step read the same value from there.

          # Run the shared policy. DISPATCH_RESULT_FILE is how the script hands
          # the outcome back: last HTTP status, failure class, detail, attempt
          # count and elapsed time, so this job's own durable signals are
          # composed from observed values rather than a local counter.
          DISPATCH_RESULT_FILE="$(mktemp)"
          if DISPATCH_RESULT_FILE="${DISPATCH_RESULT_FILE}" \
             DISPATCH_BODY="${BODY}" bash scripts/dispatch_with_retry.sh; then
            DISPATCHED="true"
          else
            DISPATCHED="false"
          fi
          # shellcheck disable=SC1090
          source "${DISPATCH_RESULT_FILE}" 2>/dev/null || true
          LAST_HTTP="${DISPATCH_LAST_HTTP:-unknown}"
          LAST_CLASS="${DISPATCH_LAST_CLASS:-}"
          LAST_DETAIL="${DISPATCH_LAST_DETAIL:-unknown}"
          ATTEMPTS="${DISPATCH_ATTEMPTS:-unknown}"
          DISPATCH_ELAPSED="${DISPATCH_BUDGET_ELAPSED:-unknown}"
          # FAR-2066 durable marker: the label an exhausted capacity/transient
          # dispatch applies and a successful dispatch clears.
          FIXER_PENDING_LABEL="fixer-dispatch-pending"
          if [ "$DISPATCHED" != "true" ]; then
            # Name the CLASS of failure, not just its HTTP code: capacity
            # saturation is an operational backlog an operator drains, while a
            # terminal error is a broken request or credential nobody is
            # waiting on. The two need different actions, so the annotation,
            # the run summary and the PR comment all carry the distinction.
            case "$LAST_CLASS" in
              capacity)
                DISPATCH_FAILURE="capacity saturated"
                DISPATCH_CAUSE="the Branch Fixer trigger is at its concurrent-run limit (HTTP ${LAST_HTTP}), so the webhook was refused because the app is busy - not because anything is broken"
                DISPATCH_ACTION="Drain in-flight Branch Fixer runs (or raise the trigger's \`max_concurrent_runs\`), then re-run this CI job to hand the failure over."
                ;;
              transient)
                DISPATCH_FAILURE="webhook unreachable"
                DISPATCH_CAUSE="the Branch Fixer webhook or a gateway in front of it was unavailable (HTTP ${LAST_HTTP}) for the whole retry budget"
                DISPATCH_ACTION="Check that control.farna.dev is healthy and that FARNA_CONTROL_BRANCH_FIXER_WEBHOOK_URL points at it, then re-run this CI job."
                ;;
              config)
                DISPATCH_FAILURE="webhook secret unavailable"
                DISPATCH_CAUSE="${LAST_DETAIL} for this run, so no request was sent. GitHub withholds Actions secrets from dependabot[bot] PRs; they need Dependabot secrets"
                DISPATCH_ACTION="Add FARNA_CONTROL_BRANCH_FIXER_WEBHOOK_URL and FARNA_CONTROL_BRANCH_FIXER_HMAC_SECRET under Settings > Secrets and variables > Dependabot, then re-run this CI job."
                ;;
              *)
                DISPATCH_FAILURE="non-retryable rejection"
                DISPATCH_CAUSE="the Branch Fixer webhook rejected the request outright (HTTP ${LAST_HTTP}) - retrying cannot help"
                DISPATCH_ACTION="Check FARNA_CONTROL_BRANCH_FIXER_HMAC_SECRET and the webhook payload; this needs a code or configuration fix, not a retry."
                ;;
            esac
            echo "::error::Branch Fixer webhook dispatch failed — ${DISPATCH_FAILURE} after ${ATTEMPTS} attempt(s) in ${DISPATCH_ELAPSED}s (last HTTP ${LAST_HTTP}: ${LAST_DETAIL}). CI failure was not handed to the autonomous fix loop."
            # The shared script has already written the durable summary block
            # (failure class, attempt count, last HTTP status, cause, remedy)
            # to this job's run summary. Add only what the script cannot know:
            # this job's own consequence in the fix loop.
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo ""
                echo "- PR: #${PR_NUM} — **the CI failure was not handed to the autonomous fix loop**."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            # FAR-2066 durable marker: a capacity/transient exhaustion means
            # this CI failure is still OWED a fixer run, but the only traces
            # were a PR comment and a run summary. Label the PR so the
            # outstanding hand-over outlives the log/review window. A TERMINAL
            # rejection is deliberately NOT labelled: retrying cannot help, so
            # that is a fix (secret/payload), not a pending dispatch, and the
            # label must mean exactly one thing to whoever sweeps it.
            #
            # `gh pr edit --add-label` silently no-ops (FAR-1173), so the REST
            # endpoint is used. A label failure is a WARNING, never a second
            # hard failure: the dispatch-failure comment below remains the hard
            # requirement (and the exit-code contract below is unchanged).
            LABEL_NOTE=""
            case "$LAST_CLASS" in
              capacity|transient)
                if LABEL_ERR=$(gh api -X POST "repos/${REPO}/issues/${PR_NUM}/labels" -f "labels[]=${FIXER_PENDING_LABEL}" 2>&1); then
                  LABEL_NOTE="A \`${FIXER_PENDING_LABEL}\` label has been applied to this PR so the undelivered dispatch stays visible until a fixer run is handed this failure."
                else
                  echo "::warning::Could not apply the '${FIXER_PENDING_LABEL}' label to PR #${PR_NUM} (${LABEL_ERR}) — the dispatch-failure comment and run summary below remain the durable record."
                  LABEL_NOTE="The \`${FIXER_PENDING_LABEL}\` label could **not** be applied automatically, so the outstanding dispatch is recorded only in this comment and the job summary."
                fi
                ;;
              *)
                echo "::error::Unexpected dispatch failure class '${LAST_CLASS:-<empty>}' — refusing to apply a retry label."
                exit 1
                ;;
            esac
            # FAR-1997: the job now checks out ONLY scripts/dispatch_with_retry.sh
            # (the dispatch policy is shared code, not an inline loop), but the
            # repository is still passed explicitly to every `gh` command. It
            # works identically with a checkout and keeps the command
            # independent of what the checkout leaves in the working tree -
            # FAR-1997 was an unqualified `gh pr comment` dying with "fatal:
            # not a git repository" before it reached the API.
            #
            # A dispatch failure whose notice cannot be posted leaves a stalled
            # fix loop indistinguishable from a working one, so an unpostable
            # notice is a HARD error (its own non-zero exit code), never a
            # warning annotation: exit 1 = dispatch failed but the PR was told,
            # exit 2 = dispatch failed AND the PR could not be told.
            if ! gh pr comment "$PR_NUM" --repo "$REPO" --body "## Branch Fixer Dispatch Failed — ${DISPATCH_FAILURE}

            The CI failure notification could not be delivered to the Branch Fixer pipeline after ${ATTEMPTS} attempt(s) over ${DISPATCH_ELAPSED}s.

            **HTTP status:** \`${LAST_HTTP}\`
            **Detail:** ${LAST_DETAIL}
            **Why:** ${DISPATCH_CAUSE}

            ${DISPATCH_ACTION}

            ${LABEL_NOTE}

            The automated fix loop is **not active** for this PR."; then
              echo "::error::Failed to post dispatch-failure comment on PR #${PR_NUM} — the stalled fix loop could not be announced."
              exit 2
            fi
            exit 1
          fi
          # FAR-2066: a successful hand-over CLEARS the durable marker an
          # earlier exhausted dispatch left behind, so the label always means
          # "a fixer run is still owed". A 404 means the label was not present
          # (the normal case) and is tolerated silently; any other failure is a
          # warning on an otherwise delivered dispatch.
          if ! LABEL_CLEAR_ERR=$(gh api -X DELETE "repos/${REPO}/issues/${PR_NUM}/labels/${FIXER_PENDING_LABEL}" 2>&1); then
            case "$LABEL_CLEAR_ERR" in
              *404*) : ;;
              *) echo "::warning::Could not clear the 'fixer-dispatch-pending' label from PR #${PR_NUM} (${LABEL_CLEAR_ERR}) — the dispatch itself was delivered." ;;
            esac
          fi
          # Explicit success exit: the dispatch was accepted (202) or was a
          # handled duplicate (400 "Duplicate webhook payload"/coalesced).
          echo "Branch Fixer dispatch delivered (HTTP ${LAST_HTTP})."
          exit 0

      - name: Report Branch Fixer check status
        if: success()
        run: echo "Branch Fixer trigger check passed (required checks green, fixer dispatched, or dispatch suppressed by a guard)."

  notify-main-failure:
    name: Trigger Branch Fixer on main CI failure
    # When CI fails on a workflow_dispatch to main, dispatch the Branch Fixer so
    # it creates a fix branch, diagnoses, and raises a PR. This closes the gap
    # where main CI failures outside the deploy pre-deploy gate (e.g. schema
    # freshness, secret scan) had no automated fix mechanism. The Branch Fixer
    # creates its own fix branch from main — branchName: main, prNumber: 0
    # signals this.
    #
    # There is no `push:` trigger on this workflow any more: main only changes
    # through the merge train, which dispatches this workflow after a merge.
    # The `push` clause below is retained deliberately - it costs nothing while
    # the trigger is absent, and it means re-adding a push trigger cannot
    # silently bypass the dispatcher.
    #
    # FAR-1947/FAR-1429: `needs` must list EVERY job that can run and fail on
    # this job's own events (push or workflow_dispatch to main) — the
    # `contains(needs.*.result, 'failure')` guard below only sees jobs named
    # here, so a failing job omitted from this list never reaches the dispatcher.
    # Every job in the list below runs on a dispatch (the path detector forces
    # all outputs true off-PR), so all of them can fail and must be listed.
    # Still excluded, per its own condition: `notify-pr-failure`
    # (`github.event_name == 'pull_request' && ...`) never runs on a push or
    # dispatch to main, so it cannot fail there.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && always()
    needs: [current-head-gate, changes, backend-lint, uv-lock-check, backend-affected-tests, frontend-lint, schema-freshness, gitleaks, copy-consistency, migration-heads-check, e2e-route-methods-check, break-glass-deploy-gate]
    runs-on: ubicloud-standard-2
    permissions:
      actions: write
      # The checkout below fetches scripts/dispatch_with_retry.sh; job-level
      # permissions replace the workflow-level `contents: read`.
      contents: read
      # scripts/main_failure_fix_pr_open.sh lists open PRs to find an existing
      # fix for this failure, and comments the new failing run on it.
      pull-requests: write
    steps:
      # The dispatch policy is shared code, so this job checks out exactly that
      # one file. Same guard as the dispatch step: a main run that is cancelled
      # rather than failed does nothing here, and should not fail on a checkout
      # either.
      - name: Check out the dispatch script
        if: contains(needs.*.result, 'failure')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Trigger Farna Control Branch Fixer
        # Only dispatch on a real failure. A manually cancelled main run is an
        # intentional action, not a CI break, so we must not dispatch the
        # Branch Fixer for it.
        # Step-level failure() only reflects failures in previous steps WITHIN
        # THIS JOB — it does NOT see failed jobs in `needs:`. Use
        # `needs.*.result` instead (cf. deploy.yml's fixer job which uses the
        # same pattern).
        if: contains(needs.*.result, 'failure')
        env:
          DISPATCH_URL: ${{ secrets.FARNA_CONTROL_BRANCH_FIXER_WEBHOOK_URL }}
          DISPATCH_SECRET: ${{ secrets.FARNA_CONTROL_BRANCH_FIXER_HMAC_SECRET }}
          DISPATCH_LABEL: "Farna Control Branch Fixer"
          MAIN_SHA: ${{ github.sha }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # headSha (FAR-1034): mirrors the notify-pr-failure payload so the
          # Branch Fixer trigger can coalesce repeated failures at the same
          # main SHA. The fixer needs it, so it stays in the payload.
          #
          # The FINGERPRINT, however, is stable ACROSS main commits: it keys on
          # the workflow + the failure identity (the sorted ids of the failed
          # `needs` jobs), never on the SHA. When main goes red every later
          # merge produces another red run; a SHA-keyed fingerprint made each
          # one look new, so one SonarCloud failure on 2026-11-17 raised four
          # Branch Fixer PRs (#3214-#3217). A per-PR dispatch keeps (PR, SHA)
          # keying — that is correct there; only main is SHA-independent.
          # If the job list cannot be derived, fail closed to a constant
          # (`unknown-jobs`), never to the SHA.
          FAILED_JOBS=$(printf '%s' "${NEEDS_JSON}" | jq -r '[to_entries[] | select(.value.result == "failure") | .key] | sort | join(",")' 2>/dev/null || true)
          if [ -z "${FAILED_JOBS}" ]; then
            FAILED_JOBS="unknown-jobs"
          fi
          FINGERPRINT="CI: Fast Validation|main|${FAILED_JOBS}"
          # Dispatcher-side skip: an OPEN PR whose body carries this exact
          # fingerprint (the Branch Fixer embeds
          # `<!-- branch-fixer-fingerprint: <fp> -->`) is already fixing this
          # failure, so do not dispatch again. The script fails OPEN: a lookup
          # error warns and we dispatch anyway (the fixer has its own gate).
          if FIX_FINGERPRINT="${FINGERPRINT}" RUN_URL="${RUN_URL}" bash scripts/main_failure_fix_pr_open.sh; then
            exit 0
          fi
          BODY=$(jq -n \
            --arg branchName "main" \
            --argjson prNumber 0 \
            --arg headSha "${MAIN_SHA}" \
            --arg runUrl "${RUN_URL}" \
            --arg failureDescription "CI checks failed on main at ${{ github.sha }}. The Branch Fixer should create a fix branch from main, diagnose the failure, fix it, and raise a PR." \
            --arg fingerprint "${FINGERPRINT}" \
            '{branchName: $branchName, prNumber: $prNumber, headSha: $headSha, runUrl: $runUrl, failureDescription: $failureDescription, fingerprint: $fingerprint}')
          echo "CI checks failed on main (${{ github.sha }}) -- dispatching Branch Fixer."
          # ONE shared retry policy: scripts/dispatch_with_retry.sh — the same
          # single definition the sibling PR-failure step calls. It owns the
          # classification (429 = capacity saturation, 000/502/503/504 =
          # transient, every other non-2xx = terminal), the bounded retry
          # (attempt cap AND a 300s wall-clock budget), Retry-After handling and
          # exponential backoff with jitter. On an undelivered dispatch it
          # emits its own class-named ::error:: and a durable run summary; the
          # failure arm below adds this job's own consequence.
          #
          # The bound itself (attempt cap + 300s wall-clock budget) lives in
          # the script. To override it, set DISPATCH_BUDGET_SECONDS /
          # DISPATCH_MAX_ATTEMPTS in the workflow environment — both the script
          # and this step read the same value from there.

          # Run the shared policy. DISPATCH_RESULT_FILE is how the script hands
          # the outcome back: last HTTP status, failure class, detail, attempt
          # count and elapsed time, so this job's own durable signal is
          # composed from observed values rather than a local counter.
          DISPATCH_RESULT_FILE="$(mktemp)"
          if DISPATCH_RESULT_FILE="${DISPATCH_RESULT_FILE}" \
             DISPATCH_BODY="${BODY}" bash scripts/dispatch_with_retry.sh; then
            DISPATCHED="true"
          else
            DISPATCHED="false"
          fi
          # shellcheck disable=SC1090
          source "${DISPATCH_RESULT_FILE}" 2>/dev/null || true
          LAST_HTTP="${DISPATCH_LAST_HTTP:-unknown}"
          LAST_CLASS="${DISPATCH_LAST_CLASS:-}"
          LAST_DETAIL="${DISPATCH_LAST_DETAIL:-unknown}"
          ATTEMPTS="${DISPATCH_ATTEMPTS:-unknown}"
          DISPATCH_ELAPSED="${DISPATCH_BUDGET_ELAPSED:-unknown}"
          if [ "$DISPATCHED" != "true" ]; then
            # Name the CLASS of failure, not just its HTTP code: capacity
            # saturation is an operational backlog an operator drains, while a
            # terminal error is a broken request or credential nobody is
            # waiting on. The cause and remedy live in the shared script's own
            # annotation and summary, so this job only names the class and its
            # own consequence (a main failure has no PR to comment on).
            case "$LAST_CLASS" in
              capacity) DISPATCH_FAILURE="capacity saturated" ;;
              transient) DISPATCH_FAILURE="webhook unreachable" ;;
              config) DISPATCH_FAILURE="webhook secret unavailable" ;;
              *) DISPATCH_FAILURE="non-retryable rejection" ;;
            esac
            echo "::error::Branch Fixer webhook dispatch failed — ${DISPATCH_FAILURE} after ${ATTEMPTS} attempt(s) in ${DISPATCH_ELAPSED}s (last HTTP ${LAST_HTTP}: ${LAST_DETAIL}). Main CI failure was not handed to the autonomous fix loop."
            # A main failure has no PR to comment on, so the run summary is the
            # durable signal that the fixer was never dispatched. The shared
            # script has already written the block (class, attempts, last HTTP,
            # cause, remedy) to this job's summary; add this job's consequence.
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo ""
                echo "- **The main CI failure was not handed to the autonomous fix loop.**"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          fi
          # Explicit success exit: the dispatch was accepted (202) or was a
          # handled duplicate (400 "Duplicate webhook payload"/coalesced).
          echo "Branch Fixer dispatch delivered (HTTP ${LAST_HTTP})."
          exit 0

  # FAR-1843: the PR-reviewer dispatch (former job `notify-pr-review`, name
  # "Trigger PR Reviewer") has MOVED to .github/workflows/pr-review.yml,
  # driven by a workflow_run completion trigger on this workflow. When the
  # dispatch lived here with `always()` + `needs:` every failing-capable job,
  # a dispatch outage (e.g. an app HTTP 429) concluded this whole run as
  # failure — indistinguishable from product-CI failure to merge-queue.yml's
  # merge gate — and blocked every merge while red CI fanned Branch Fixer runs
  # into the org sandbox cap, starving the reviewer itself. A dispatch failure
  # must never mark product CI red again. Guarded by
  # backend/tests/architecture/test_workflow_structure.py.
