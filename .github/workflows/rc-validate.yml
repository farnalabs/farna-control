name: "RC Validation (clean-host compose + upgrade matrix + own-stack fuzz)"

# Runs during the alpha release freeze. Three independent legs, none of which
# depends on a DEPLOYED environment:
#
#   1. clean-host-compose (FAR-2345) - the artefact an evaluator actually
#      downloads: the compose bundle, booted with no registry credential, i.e.
#      an anonymous pull of the immutable RC image from public GHCR followed by
#      `docker compose up -d` and a `/healthz/ready` poll.
#   2. docker-upgrade-rollback (FAR-2195) - the operator-visible upgrade /
#      failure / rollback matrix on a disposable compose project.
#   3. pen-test (FAR-2800) - the immutable RC image booted in its OWN disposable
#      compose stack (its own Postgres and Redis, its own generated secrets, its
#      own seeded account) and fuzzed with Schemathesis.
#
# Why the fuzz leg targets the RC's own stack and never a deployed host: the
# soak deployment tracks main, so an RC tag - an ancestor of main - is a
# downgrade there, and it cannot even start because main has already migrated
# the database past the RC's head (the FAR-2659 alignment guard refuses it).
# Validation therefore stands the RC up itself.
#
# v1 fuzz scope: read-only (GET) operations. The stack is disposable, so
# write-method fuzzing becomes possible, but it is deliberately not enabled in
# this leg: its job is to prove the RC answers malformed reads without a 5xx.
#
# Triggered automatically by release-unified.yml on cut/recut - dispatched from
# main, so the workflow definition is the current one, while every job checks
# out `inputs.rc_tag` for the artefact under test. Can also be dispatched
# manually with an rc_tag.

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: "The RC tag being validated (e.g. v0.1.0-rc1)"
        type: string
        required: true

concurrency:
  group: rc-validate
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Clean-host anonymous deployment of the published compose bundle (FAR-2345)
  # ---------------------------------------------------------------------------
  clean-host-compose:
    name: Clean-host anonymous compose deployment
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RC_TAG: ${{ inputs.rc_tag }}
      # Loopback port for the trial stack; the compose publishes ${PORT}:80.
      PORT: "8080"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.rc_tag }}

      - name: Confirm RC tag exists and resolve its version
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/${RC_TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${RC_TAG} not found."
            exit 1
          fi
          case "$RC_TAG" in
            v*-rc[0-9]*) ;;
            *)
              echo "::error::rc_tag '${RC_TAG}' is not an immutable vX.Y.Z-rcN tag - refusing to run a clean-host deployment against a mutable or SHA tag."
              exit 1
              ;;
          esac
          VERSION="${RC_TAG#v}"
          VERSION="${VERSION%-rc*}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Clean-host validating ${RC_TAG} (version ${VERSION}) at $(git rev-parse --short "${RC_TAG}^{commit}")"

      - name: Set up Python for the bundle packager
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.12"

      - name: Package the compose bundle exactly as the release does
        shell: bash
        run: |
          set -euo pipefail
          # Same script, same arguments as release-unified.yml's
          # "Package self-hosted compose release bundle" step: this validates
          # the shipped artefact, not a hand-made equivalent.
          uv run --no-project --no-sync --no-build --with pyyaml==6.0.3 \
            python scripts/package_compose_release.py \
            --version "$VERSION" \
            --tag "$RC_TAG" \
            --output-dir "$RUNNER_TEMP/compose-bundle"
          tar -xzf "$RUNNER_TEMP/compose-bundle/farna-control-${VERSION}-compose.tar.gz" \
            -C "$RUNNER_TEMP/compose-bundle"
          (cd "$RUNNER_TEMP/compose-bundle" && sha256sum --check SHA256SUMS)

      - name: Assert the bundle pins the immutable tag and never :latest
        shell: bash
        env:
          TAG_UNDER_TEST: ${{ inputs.rc_tag }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/compose-bundle"
          # Parse the YAML rather than grepping the raw text: the file is heavily
          # commented and a comment can never pin an image, so a text match could
          # both false-pass and false-fail.
          uv run --no-project --no-sync --no-build --with pyyaml==6.0.3 python - <<'PY'
          import os
          import sys
          import yaml

          tag = os.environ["TAG_UNDER_TEST"]
          with open("docker-compose.prod.yml", encoding="utf-8") as handle:
              compose = yaml.safe_load(handle)

          pinned = compose["services"]["farna-control"]["image"]
          expected = f"ghcr.io/farnalabs/farna-control:{tag}"
          print(f"Bundled image reference: {pinned}")
          if pinned != expected:
              sys.exit(f"bundled compose pins {pinned!r}, expected the immutable {expected!r}")

          floating = [
              f"{name}: {service['image']}"
              for name, service in compose["services"].items()
              if isinstance(service.get("image"), str)
              and service["image"].rsplit(":", 1)[-1] in {"latest", "stable"}
          ]
          if floating:
              sys.exit(f"bundled compose floats on a moving tag: {floating}")
          PY

      - name: Start the stack anonymously (no docker login)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/compose-bundle"
          # The exact operator path: the bundle ships no secret, so init-env.sh
          # generates .env on this host (the same script an evaluator runs).
          ./init-env.sh
          # An empty DOCKER_CONFIG guarantees no registry credential exists, so
          # the pull below can only succeed if the image is PUBLIC. A login the
          # runner happens to carry would turn this into a false pass.
          for credential_var in CR_PAT GHCR_TOKEN DOCKER_USERNAME DOCKER_PASSWORD; do
            if [ -n "$(printenv "$credential_var" || true)" ]; then
              echo "::error::registry credential ${credential_var} is present in this job's environment; the anonymous-pull guarantee cannot be proven here."
              exit 1
            fi
          done
          DOCKER_CONFIG="$(mktemp -d)"
          export DOCKER_CONFIG
          echo "DOCKER_CONFIG=${DOCKER_CONFIG}" >> "$GITHUB_ENV"
          echo "Anonymous docker config: ${DOCKER_CONFIG} (no auth.json, no credential helper)"
          docker compose version
          docker compose -f docker-compose.prod.yml up -d
          docker compose -f docker-compose.prod.yml ps

      - name: Poll /healthz/ready until 200 OK
        shell: bash
        run: |
          set -euo pipefail
          READY_URL="http://127.0.0.1:${PORT}/healthz/ready"
          echo "Polling ${READY_URL}"
          CODE=""
          for attempt in $(seq 1 60); do
            CODE="$(curl -s -m 10 -o "$RUNNER_TEMP/ready.json" -w '%{http_code}' "$READY_URL" || true)"
            if [ "$CODE" = "200" ]; then
              echo "Ready after ${attempt} attempt(s) (HTTP 200):"
              cat "$RUNNER_TEMP/ready.json"
              exit 0
            fi
            echo "Attempt ${attempt}: ${READY_URL} returned HTTP ${CODE:-<none>}; waiting..."
            sleep 10
          done
          echo "::error::${READY_URL} never returned 200 OK within 10 minutes (last HTTP ${CODE:-<none>}). Dumping diagnostics:"
          (cd "$RUNNER_TEMP/compose-bundle" && docker compose -f docker-compose.prod.yml ps) || echo "::warning::could not dump container state"
          (cd "$RUNNER_TEMP/compose-bundle" && docker compose -f docker-compose.prod.yml logs --no-color --tail=200) || echo "::warning::could not dump container logs"
          exit 1

      - name: Tear down the trial stack
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/compose-bundle/docker-compose.prod.yml" ]; then
            echo "No bundle to tear down."
            exit 0
          fi
          cd "$RUNNER_TEMP/compose-bundle"
          # Best-effort cleanup: a teardown failure must be visible but must not
          # mask the outcome the gate already reported.
          if ! docker compose -f docker-compose.prod.yml down --volumes --remove-orphans; then
            echo "::warning::could not fully tear down the trial stack; the runner is ephemeral."
          fi

  # ---------------------------------------------------------------------------
  # Docker upgrade / failure / rollback acceptance matrix (FAR-2195)
  # ---------------------------------------------------------------------------
  docker-upgrade-rollback:
    name: Docker upgrade and rollback acceptance matrix
    needs: [clean-host-compose]
    runs-on: ubicloud-standard-2
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      RC_TAG: ${{ inputs.rc_tag }}
      PORT: "18081"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.rc_tag }}
          persist-credentials: false

      - name: Set up Python for the release harness
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.12"

      - name: Package the exact RC compose asset
        shell: bash
        run: |
          set -euo pipefail
          version="${RC_TAG#v}"
          version="${version%-rc*}"
          uv run --no-project --no-sync --no-build --with pyyaml==6.0.3 \
            python scripts/package_compose_release.py \
            --version "$version" \
            --tag "$RC_TAG" \
            --output-dir "$RUNNER_TEMP/compose-matrix"
          tar -xzf "$RUNNER_TEMP/compose-matrix/farna-control-${version}-compose.tar.gz" \
            -C "$RUNNER_TEMP/compose-matrix"
          (cd "$RUNNER_TEMP/compose-matrix" && sha256sum --check SHA256SUMS)
          cd "$RUNNER_TEMP/compose-matrix" && ./init-env.sh


      - name: Render matrix compose image from the phase TAG
        shell: bash
        env:
          MATRIX_COMPOSE_FILE: ${{ runner.temp }}/compose-matrix/docker-compose.prod.yml
        run: |
          set -euo pipefail
          # The packaged compose asset is intentionally hard-pinned to RC_TAG.
          # Keep that verified artefact intact, but render the working matrix
          # copy to use the TAG environment variable that each phase supplies.
          # Without this substitution every phase silently exercises RC_TAG.
          uv run --no-project --no-sync --no-build python scripts/render_validation_compose.py \
            --compose-file "$MATRIX_COMPOSE_FILE"

      - name: Resolve the previous published immutable bundle tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate --slurp > "$RUNNER_TEMP/release-pages.json"
          version="${RC_TAG#v}"
          version="${version%-rc*}"
          current_bundle_tag="bundle-v${version}"
          # release-unified publishes the current bundle AFTER it dispatches this
          # validation, so the current tag cannot be required in the release
          # history. Resolve the greatest already-published tag strictly below
          # the current version; the current tag itself is excluded.
          if ! bundle_tag="$(python3 scripts/validate_release_tag.py resolve-previous \
            --current "$current_bundle_tag" \
            --release-json "$RUNNER_TEMP/release-pages.json")"; then
            echo "::error::could not resolve a previous published bundle-v* release from the release history; refusing to claim Docker upgrade/rollback coverage"
            exit 1
          fi
          if [ -z "$bundle_tag" ]; then
            echo "::error::no previous published bundle-v* release exists; refusing to claim Docker upgrade/rollback coverage"
            exit 1
          fi

          case "$bundle_tag" in
            bundle-v*) ;;
            *)
              echo "::error::release resolver returned unexpected tag '${bundle_tag}'; expected bundle-vX.Y.Z"
              exit 1
              ;;
          esac

          # A bundle cut or recut is published before promotion, so its compose
          # asset may pin the RC image (for example v1.2.0-rc2), not the stable
          # v1.2.0 tag. Read the image reference from that immutable predecessor
          # bundle instead of deriving a stable tag that may not exist yet.
          bundle_version="${bundle_tag#bundle-v}"
          # FAR-2580 renamed the published release artefacts from
          # modulo-<v>-* to farna-control-<v>-*. bundle-v0.3.328 and earlier
          # were published before that rename, so a published predecessor
          # bundle legitimately carries the legacy compose asset name. Only the
          # filename lookup is tolerant: whichever name the release actually
          # carries is downloaded, matched against its SHA256SUMS entry,
          # unpacked and provenance-verified exactly as before.
          #
          # Resolved here rather than in scripts/validate_release_tag.py on
          # purpose: this job checks out the RC TAG's tree, so a helper added
          # after that RC was cut does not exist in it, and re-validating an
          # already-cut RC must still be able to resolve its predecessor.
          if ! compose_asset="$(python3 - "$RUNNER_TEMP/release-pages.json" "$bundle_tag" "$bundle_version" <<'ASSET'
          import json
          import sys

          release_pages_path, bundle_tag, bundle_version = sys.argv[1:4]
          # Post-rename name first: a release that somehow carries both is
          # resolved to the current artefact of record.
          candidates = (
              f"farna-control-{bundle_version}-compose.tar.gz",
              f"modulo-{bundle_version}-compose.tar.gz",
          )
          with open(release_pages_path, encoding="utf-8") as handle:
              pages = json.load(handle)
          assets = None
          for page in pages:
              for release in page:
                  if release.get("tag_name") != bundle_tag:
                      continue
                  if release.get("draft") is not False or release.get("prerelease") is not False:
                      sys.exit(f"published predecessor bundle {bundle_tag} is not a published release")
                  assets = {asset.get("name") for asset in release.get("assets") or [] if isinstance(asset, dict)}
          if assets is None:
              sys.exit(f"release history does not contain {bundle_tag}")
          for candidate in candidates:
              if candidate in assets:
                  print(candidate)
                  break
          else:
              sys.exit(f"published predecessor bundle {bundle_tag} has no compose asset matching {' or '.join(candidates)}")
          ASSET
          )"; then
            echo "::error::published predecessor bundle ${bundle_tag} has no compose asset matching farna-control-${bundle_version}-compose.tar.gz or modulo-${bundle_version}-compose.tar.gz; refusing Docker upgrade/rollback coverage"
            exit 1
          fi
          if [ -z "$compose_asset" ]; then
            echo "::error::could not resolve the compose asset name of published predecessor bundle ${bundle_tag}; refusing Docker upgrade/rollback coverage"
            exit 1
          fi
          case "$compose_asset" in
            farna-control-"${bundle_version}"-compose.tar.gz)
              predecessor_naming="farna-control"
              ;;
            modulo-"${bundle_version}"-compose.tar.gz)
              predecessor_naming="legacy-modulo"
              ;;
            *)
              echo "::error::release resolver returned unexpected compose asset '${compose_asset}' for ${bundle_tag}; expected farna-control-${bundle_version}-compose.tar.gz or modulo-${bundle_version}-compose.tar.gz"
              exit 1
              ;;
          esac
          echo "Using predecessor bundle ${bundle_tag} compose asset ${compose_asset} (${predecessor_naming} naming)."
          gh release download "$bundle_tag" \
            --repo "${{ github.repository }}" \
            --pattern "$compose_asset" \
            --dir "$RUNNER_TEMP" \
            --clobber
          downloaded_archive="$RUNNER_TEMP/${compose_asset}"
          if [ ! -s "$downloaded_archive" ]; then
            echo "::error::published predecessor bundle ${bundle_tag} has no downloadable compose asset ${compose_asset}; refusing Docker upgrade/rollback coverage"
            exit 1
          fi
          gh release download "$bundle_tag" \
            --repo "${{ github.repository }}" \
            --pattern SHA256SUMS \
            --dir "$RUNNER_TEMP" \
            --clobber
          published_sums="$RUNNER_TEMP/SHA256SUMS"
          if [ ! -s "$published_sums" ]; then
            echo "::error::published predecessor bundle ${bundle_tag} has no SHA256SUMS artifact; refusing Docker upgrade/rollback coverage"
            exit 1
          fi
          archive_checksum_line="$(awk -v asset="$(basename "$downloaded_archive")" '$2 == asset { print; found=1 } END { if (!found) exit 1 }' "$published_sums" || true)"
          if [ -z "$archive_checksum_line" ]; then
            echo "::error::published predecessor bundle ${bundle_tag} has no checksum for $(basename "$downloaded_archive") in SHA256SUMS; refusing Docker upgrade/rollback coverage"
            exit 1
          fi
          if ! printf '%s\n' "$archive_checksum_line" | (cd "$RUNNER_TEMP" && sha256sum --check --status -); then
            echo "::error::checksum mismatch for published predecessor bundle asset $(basename "$downloaded_archive"); refusing Docker upgrade/rollback coverage"
            exit 1
          fi
          bundle_dir="$(mktemp -d)"
          tar -xzf "$downloaded_archive" -C "$bundle_dir"
          compose_file="$bundle_dir/docker-compose.prod.yml"
          if [ ! -s "$compose_file" ]; then
            echo "::error::predecessor bundle ${bundle_tag} does not contain docker-compose.prod.yml; refusing Docker upgrade/rollback coverage"
            exit 1
          fi
          old_tag="$(COMPOSE_FILE="$compose_file" BUNDLE_VERSION="$bundle_version" \
            uv run --no-project --no-sync --no-build --with pyyaml==6.0.3 python - <<'PY'
          import os
          import re
          import sys

          import yaml

          compose_path = os.environ["COMPOSE_FILE"]
          with open(compose_path, encoding="utf-8") as handle:
              compose = yaml.safe_load(handle)
          # FAR-2651 renamed the prod compose app service to farna-control. A
          # predecessor bundle cut before the rename still carries the legacy
          # service name; from the second post-rename release onward it carries
          # `farna-control`. Accept either, preferring the current post-rename
          # service (mirroring the dual compose-asset-name accept).
          services = compose.get("services", {}) or {}
          service = services.get("farna-control") or services.get("modulo") or {}
          image = service.get("image")
          prefix = "ghcr.io/farnalabs/farna-control:"
          if not isinstance(image, str) or not image.startswith(prefix):
              sys.exit(f"predecessor compose has invalid modulo image reference: {image!r}")
          tag = image[len(prefix):]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:-rc[0-9]+)?", tag):
              sys.exit(f"predecessor compose pins non-immutable or unexpected image tag: {tag!r}")
          expected_version = os.environ["BUNDLE_VERSION"]
          if not re.fullmatch(rf"v{re.escape(expected_version)}(?:-rc[0-9]+)?", tag):
              sys.exit(
                  f"predecessor compose image tag {tag!r} does not match "
                  f"published predecessor bundle version {expected_version!r} (including any RC suffix)"
              )
          print(tag)
          PY
          )"
          if [ -z "$old_tag" ]; then
            echo "::error::could not resolve the predecessor image tag from bundle ${bundle_tag}; refusing Docker upgrade/rollback coverage"
            exit 1
          fi
          echo "OLD_TAG=$old_tag" >> "$GITHUB_ENV"
          echo "Using predecessor bundle image tag $old_tag (pinned by bundle $bundle_tag) as the rollback target."

          # A release tag is only a lookup key: GHCR tags can be retargeted.
          # Resolve the exact manifest digest through the authenticated registry
          # path, then require GitHub-published provenance for that digest.
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          old_image="ghcr.io/farnalabs/farna-control:${old_tag}"
          old_digest="$(docker buildx imagetools inspect "$old_image" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [[ ! "$old_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::could not resolve a valid GHCR manifest digest for ${old_image}: ${old_digest:-<empty>}"
            exit 1
          fi
          old_subject="oci://ghcr.io/farnalabs/farna-control@${old_digest}"
          if ! gh attestation verify "$old_subject" --repo "${{ github.repository }}" --format json > "$RUNNER_TEMP/predecessor-image-attestation.json"; then
            echo "::error::no verifiable build provenance for ${old_subject}; refusing Docker upgrade/rollback coverage"
            exit 1
          fi
          uv run --no-project --no-sync --no-build python scripts/validate_release_tag.py verify-image-digest \
            --image "$old_image" \
            --digest "$old_digest" \
            --attestation-json "$RUNNER_TEMP/predecessor-image-attestation.json"
          echo "Verified predecessor image identity: ${old_image} -> ${old_digest}"
          # Record the predecessor asset name that passed every gate above. The
          # file is only written once provenance has verified, so the evidence
          # step can never report a predecessor that failed validation. Every
          # value is already constrained by the checks above, so the JSON is
          # safe to interpolate.
          cat > "$RUNNER_TEMP/predecessor-asset.json" <<JSON
          {
            "asset_naming": "${predecessor_naming}",
            "bundle_tag": "${bundle_tag}",
            "compose_asset": "${compose_asset}",
            "image_digest": "${old_digest}",
            "verified": true
          }
          JSON

      - name: Run the Docker upgrade / failure / rollback matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_compose_upgrade_rollback.py \
            --compose-file "$RUNNER_TEMP/compose-matrix/docker-compose.prod.yml" \
            --env-file "$RUNNER_TEMP/compose-matrix/.env" \
            --old-tag "$OLD_TAG" \
            --new-tag "$RC_TAG" \
            --project-name "rc-matrix-${GITHUB_RUN_ID}" \
            --port "$PORT" \
            --evidence-dir "$RUNNER_TEMP/compose-matrix-evidence"

      - name: Record predecessor bundle asset evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # The evidence directory must be absent or empty when the matrix
          # starts (verify_compose_upgrade_rollback.py refuses a non-empty
          # one), so the predecessor record is copied in after the matrix and
          # lands in the same uploaded artefact.
          predecessor_record="$RUNNER_TEMP/predecessor-asset.json"
          if [ ! -s "$predecessor_record" ]; then
            echo "::warning::no verified predecessor compose asset was resolved; nothing to record in the evidence artefact"
            exit 0
          fi
          evidence_dir="$RUNNER_TEMP/compose-matrix-evidence"
          mkdir -p "$evidence_dir"
          cp "$predecessor_record" "$evidence_dir/predecessor-asset.json"
          echo "Recorded predecessor bundle asset evidence:"
          cat "$evidence_dir/predecessor-asset.json"

      - name: Upload Docker acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alpha-docker-upgrade-rollback-${{ github.run_id }}
          path: ${{ runner.temp }}/compose-matrix-evidence
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Read-only pen test against the RC's OWN disposable stack (FAR-2800)
  #
  # Nothing in this leg depends on a deployed environment. The immutable RC
  # image is stood up in a throwaway compose stack - its own Postgres and Redis,
  # its own generated secrets, its own seeded account - and Schemathesis fuzzes
  # THAT. Booting is the same path the other two legs use (the packaged release
  # bundle plus the shipped `init-env.sh`), so this leg exercises the artefact an
  # evaluator downloads rather than a hand-made equivalent.
  #
  # The working directory and evidence directory are derived from RUNNER_TEMP
  # inside each step: the `runner` context is not available in a job-level
  # `env:` block.
  # ---------------------------------------------------------------------------
  pen-test:
    name: Schemathesis fuzz vs the RC's own stack
    # FAR-2195 / FAR-2345: the validation marker is pushed by this job, so
    # gating it on both acceptance legs means a release is marked validated only
    # when the downloadable artefacts come up for a self-hoster AND the Docker
    # upgrade/failure/rollback matrix passes.
    needs: [clean-host-compose, docker-upgrade-rollback]
    runs-on: ubicloud-standard-2
    # No deploy wait is involved any more: the budget covers the image pull and
    # first boot (up to 10 minutes of readiness polling), the smoke bootstrap,
    # the Schemathesis run (capped at 45 by its own step timeout) and teardown.
    timeout-minutes: 75
    permissions:
      # This job owns the validated/<rc_tag> marker tag.
      contents: write
    env:
      RC_TAG: ${{ inputs.rc_tag }}
      # Loopback port this stack publishes the app on (the bundle publishes
      # ${PORT}:80). 18082 keeps it clear of the matrix leg's 18081.
      PORT: "18082"
      # One compose project per run, so every `docker compose` invocation in
      # this job - including the ones inside scripts/smoke-compose.sh - targets
      # this stack and nothing else on the host.
      COMPOSE_PROJECT_NAME: rc-fuzz-${{ github.run_id }}
      # Throwaway account seeded into THIS stack only. The boot seeder grants it
      # the admin role and creates the default organisation, so the fuzz run
      # covers the whole documented surface. The password is generated per run
      # in the boot step below; no repository secret is used or required.
      FUZZ_EMAIL: admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The RC's own tree: the packager, the compose file and the smoke
          # script are the ones this release ships.
          ref: ${{ inputs.rc_tag }}
          fetch-depth: 0

      - name: Set up Python for the release harness
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.12"

      - name: Confirm the RC tag is an immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/${RC_TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${RC_TAG} not found."
            exit 1
          fi
          case "$RC_TAG" in
            v*-rc[0-9]*) ;;
            *)
              echo "::error::rc_tag '${RC_TAG}' is not an immutable vX.Y.Z-rcN tag - refusing to fuzz a mutable or SHA reference."
              exit 1
              ;;
          esac
          echo "Fuzzing ${RC_TAG} at $(git rev-parse --short "${RC_TAG}^{commit}") in a disposable local stack."

      - name: Package the exact RC compose bundle
        shell: bash
        run: |
          set -euo pipefail
          stack_dir="${RUNNER_TEMP}/rc-fuzz-stack"
          version="${RC_TAG#v}"
          version="${version%-rc*}"
          mkdir -p "$stack_dir"
          # Same script and arguments as release-unified.yml's packaging step:
          # this validates the shipped artefact, not a hand-made equivalent.
          uv run --no-project --no-sync --no-build --with pyyaml==6.0.3 \
            python scripts/package_compose_release.py \
            --version "$version" \
            --tag "$RC_TAG" \
            --output-dir "$stack_dir"
          tar -xzf "$stack_dir/farna-control-${version}-compose.tar.gz" -C "$stack_dir"
          (cd "$stack_dir" && sha256sum --check SHA256SUMS)
          # The packager hard-pins the immutable RC tag on the app service and
          # refuses any other reference, so the target image can never be a
          # mutable tag. Assert the pinned line anyway: the fuzz result is only
          # about THIS release.
          grep -F "image: ghcr.io/farnalabs/farna-control:${RC_TAG}" "$stack_dir/docker-compose.prod.yml"

      - name: Start the RC's own disposable stack
        shell: bash
        run: |
          set -euo pipefail
          stack_dir="${RUNNER_TEMP}/rc-fuzz-stack"
          cd "$stack_dir"
          # The bundle ships no secret: init-env.sh generates every REQUIRED
          # value on this runner (SECRET_KEY, FERNET_KEY, DB password, SAQ auth).
          ./init-env.sh
          # Seed a throwaway account - and, through it, the default organisation -
          # into THIS stack only. Generated per run; nothing here comes from a
          # deployment and nothing here can reach one.
          fuzz_password="$(openssl rand -hex 24)"
          echo "::add-mask::${fuzz_password}"
          echo "FUZZ_PASSWORD=${fuzz_password}" >> "$GITHUB_ENV"
          printf 'FARNA_CONTROL_USERS=%s:%s\n' "$FUZZ_EMAIL" "$fuzz_password" >> .env
          # TAG only labels the release inside the app (FARNA_CONTROL_VERSION);
          # the image itself is pinned by the packager.
          export TAG="$RC_TAG"
          docker compose -f docker-compose.prod.yml up -d
          docker compose -f docker-compose.prod.yml ps

      - name: Wait for the stack to report ready
        shell: bash
        run: |
          set -euo pipefail
          stack_dir="${RUNNER_TEMP}/rc-fuzz-stack"
          ready_url="http://127.0.0.1:${PORT}/healthz/ready"
          code=""
          for attempt in $(seq 1 60); do
            code="$(curl -s -m 10 -o "$RUNNER_TEMP/ready.json" -w '%{http_code}' "$ready_url" || true)"
            if [ "$code" = "200" ]; then
              echo "Stack ready after ${attempt} attempt(s) (HTTP 200):"
              cat "$RUNNER_TEMP/ready.json"
              exit 0
            fi
            echo "Attempt ${attempt}: ${ready_url} returned HTTP ${code:-<none>}; waiting..."
            sleep 10
          done
          # Fail honestly: a readiness timeout names what the containers said,
          # rather than only reporting that time ran out.
          echo "::error::${ready_url} never returned 200 within 10 minutes (last HTTP ${code:-<none>}). Container state and logs follow."
          (cd "$stack_dir" && docker compose -f docker-compose.prod.yml ps) || echo "::warning::could not read container state"
          (cd "$stack_dir" && docker compose -f docker-compose.prod.yml logs --no-color --tail=200) || echo "::warning::could not read container logs"
          exit 1

      - name: Bootstrap the fuzz account, organisation and credential
        shell: bash
        run: |
          set -euo pipefail
          stack_dir="${RUNNER_TEMP}/rc-fuzz-stack"
          cd "$stack_dir"
          # Service names come from the packaged compose, so this works for an RC
          # whose Postgres or app service predates a rename. `tr -d '\r'` keeps
          # the values free of a carriage return, which would turn the database
          # name into "farna_control\r" and make psql report it as missing.
          uv run --no-project --no-sync --no-build --with pyyaml==6.0.3 \
            python - docker-compose.prod.yml <<'PY' | tr -d '\r' > "$RUNNER_TEMP/stack-coordinates.txt"
          import sys

          import yaml

          with open(sys.argv[1], encoding="utf-8") as handle:
              services = yaml.safe_load(handle)["services"]
          db_service = next((name for name in ("postgres", "db") if name in services), None)
          if db_service is None:
              sys.exit("packaged compose has no Postgres service to smoke-check")
          environment = services[db_service].get("environment") or {}
          user = environment.get("POSTGRES_USER") or ""
          database = environment.get("POSTGRES_DB") or ""
          if not user or not database:
              sys.exit("packaged compose does not name POSTGRES_USER / POSTGRES_DB")
          app_service = next(
              (
                  name
                  for name, service in services.items()
                  if isinstance(service, dict)
                  and str(service.get("image", "")).startswith("ghcr.io/farnalabs/farna-control:")
              ),
              None,
          )
          if app_service is None:
              sys.exit("packaged compose has no Farna Control application service")
          print(db_service, user, database, app_service)
          PY
          read -r db_service db_user db_name app_service < "$RUNNER_TEMP/stack-coordinates.txt"
          echo "Stack coordinates from the packaged compose: db_service=${db_service} db_user=${db_user} database=${db_name} app_service=${app_service}"
          echo "APP_SERVICE=${app_service}" >> "$GITHUB_ENV"

          # The shipped smoke path proves the stack actually works - login, the
          # checkpointer, the checkpoint tables, and a real credential
          # round-trip through this stack's own FERNET_KEY - rather than only
          # answering a health poll. Secrets travel in the environment, never in
          # argv.
          FARNA_CONTROL_SMOKE_EMAIL="$FUZZ_EMAIL" FARNA_CONTROL_SMOKE_PASSWORD="$FUZZ_PASSWORD" \
            "$GITHUB_WORKSPACE/scripts/smoke-compose.sh" \
              --base-url "http://127.0.0.1:${PORT}" \
              --compose-file docker-compose.prod.yml \
              --db-service "$db_service" \
              --db-user "$db_user" \
              --db-name "$db_name"

          # Mint the Bearer token the fuzz run authenticates with, and create one
          # credential that outlives the smoke check so the GET surface is fuzzed
          # against real rows.
          base="http://127.0.0.1:${PORT}"
          # The login response is written to a file and parsed as data - a
          # network response is never piped straight into an interpreter.
          python3 -c 'import json, os; print(json.dumps({"email": os.environ["FUZZ_EMAIL"], "password": os.environ["FUZZ_PASSWORD"]}))' \
            | curl -sS -m 30 -X POST "${base}/api/v1/auth/login" \
                -H 'Content-Type: application/json' --data-binary @- \
                -o "$RUNNER_TEMP/login.json"
          token="$(python3 -c 'import json, sys, pathlib; print((json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")) or {}).get("access_token") or "")' "$RUNNER_TEMP/login.json")"
          rm -f "$RUNNER_TEMP/login.json"
          if [ -z "$token" ]; then
            echo "::error::the RC's own stack did not return a Bearer token for the seeded fuzz account."
            exit 1
          fi
          echo "::add-mask::${token}"
          echo "FUZZ_JWT=${token}" >> "$GITHUB_ENV"
          credential_status="$(curl -sS -m 30 -o "$RUNNER_TEMP/credential.json" -w '%{http_code}' \
            -X POST "${base}/api/v1/model-backends" \
            -H "Authorization: Bearer ${token}" \
            -H 'Content-Type: application/json' \
            --data-binary '{"name":"rc-fuzz-credential","display_name":"RC fuzz credential","provider":"custom","model_id":"stub","api_key":"not-a-real-credential"}')"
          if [ "$credential_status" != "201" ]; then
            echo "::error::could not create the fuzz credential (HTTP ${credential_status}): $(cat "$RUNNER_TEMP/credential.json")"
            exit 1
          fi
          echo "Bootstrap complete: account, organisation and credential exist on the disposable stack."

      - name: Schemathesis fuzz against the RC's own stack
        shell: bash
        timeout-minutes: 45
        run: |
          set -euo pipefail
          stack_dir="${RUNNER_TEMP}/rc-fuzz-stack"
          evidence_dir="${RUNNER_TEMP}/rc-fuzz-evidence"
          mkdir -p "$evidence_dir/schemathesis"
          # The app's public surface (nginx) does NOT serve /openapi.json - every
          # non-/api path falls through to the SPA - so the schema is read from
          # the application's own loopback INSIDE the container. The file is an
          # artefact too, which makes a schema change visible across RCs.
          (cd "$stack_dir" && docker compose -f docker-compose.prod.yml exec -T "$APP_SERVICE" \
            python3 -c 'import sys, urllib.request; sys.stdout.buffer.write(urllib.request.urlopen("http://127.0.0.1:8000/openapi.json", timeout=60).read())') \
            > "$evidence_dir/schemathesis/openapi.json"
          python3 - "$evidence_dir/schemathesis/openapi.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              document = json.load(handle)
          paths = document.get("paths") or {}
          if not paths:
              sys.exit("the RC's OpenAPI document declares no paths")
          print(f"OpenAPI document read from the stack: {len(paths)} paths")
          PY
          # --no-build (S8541): install only from pre-built wheels - never run
          # arbitrary setup scripts during installation. schemathesis publishes
          # wheels, so this is a no-op for availability.
          uv tool install --no-build "schemathesis==4.25.2"
          # v1 severity policy: every check, GET operations only, blocking on any
          # finding. The example budget is bounded by MEASUREMENT, not taste: a
          # full GET sweep of this API runs ~3358 cases in ~16 minutes on
          # 2026-11-26 (v0.3.330-rc3, 5 examples per operation, ~3.5 cases/s), so
          # the 50 that the never-executed previous invocation carried would need
          # hours and blow this step's timeout. Raise both together if a deeper
          # budget is wanted.
          schemathesis run "$evidence_dir/schemathesis/openapi.json" \
            --url "http://127.0.0.1:${PORT}" \
            --header "Authorization: Bearer ${FUZZ_JWT}" \
            --include-method GET \
            --checks all \
            --max-examples 5 \
            --report junit,ndjson \
            --report-junit-path "$evidence_dir/schemathesis/junit.xml" \
            --report-ndjson-path "$evidence_dir/schemathesis/events.ndjson"

      - name: Capture stack diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          stack_dir="${RUNNER_TEMP}/rc-fuzz-stack"
          evidence_dir="${RUNNER_TEMP}/rc-fuzz-evidence"
          mkdir -p "$evidence_dir/stack"
          if [ ! -f "$stack_dir/docker-compose.prod.yml" ]; then
            echo "No stack was created; nothing to capture."
            exit 0
          fi
          (cd "$stack_dir" && docker compose -f docker-compose.prod.yml ps) \
            > "$evidence_dir/stack/ps.txt" 2>&1 || echo "::warning::could not capture container state"
          (cd "$stack_dir" && docker compose -f docker-compose.prod.yml logs --no-color --timestamps --tail=5000) \
            > "$evidence_dir/stack/containers.log" 2>&1 || echo "::warning::could not capture container logs"
          ls -l "$evidence_dir/stack"

      - name: Upload the fuzz report and stack logs
        # Always, not only on failure: a cancelled or failed run must still ship
        # the evidence that explains it.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alpha-rc-fuzz-${{ github.run_id }}
          path: ${{ runner.temp }}/rc-fuzz-evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Configure git
        run: |
          git config user.name "modulo-release-bot"
          git config user.email "bot@modulo.run"

      - name: Record validation success (validated/<rc_tag> marker)
        if: success()
        run: |
          VALIDATED_TAG="validated/${RC_TAG}"
          git tag -f -a "$VALIDATED_TAG" -m "rc-validate SUCCESS for ${RC_TAG}" "${RC_TAG}^{commit}"
          git push origin "$VALIDATED_TAG" --force
          echo "Validation marker pushed: $VALIDATED_TAG"

      - name: Tear down the disposable stack
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          stack_dir="${RUNNER_TEMP}/rc-fuzz-stack"
          if [ ! -f "$stack_dir/docker-compose.prod.yml" ]; then
            echo "No stack to tear down."
            exit 0
          fi
          cd "$stack_dir"
          # The runner is ephemeral, but no container may be left running. A
          # teardown failure stays visible without masking the outcome the fuzz
          # already reported.
          if ! docker compose -f docker-compose.prod.yml down --volumes --remove-orphans; then
            echo "::warning::could not fully tear down the fuzz stack; the runner is ephemeral."
          fi
