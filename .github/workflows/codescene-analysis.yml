name: CodeScene Analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codescene:
    name: CodeScene scan
    runs-on: ubicloud-standard-2
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install CodeScene CLI
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o cs-cli.zip \
            https://downloads.codescene.io/enterprise/cli/cs-linux-amd64-cfde0186a84e0588ea0a0e4cc9b9cde8389bbe80.zip
          unzip -o cs-cli.zip
          chmod +x cs

      - name: Run CodeScene change-set analysis
        run: ./cs delta --output-format=json --include-metadata origin/main
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
