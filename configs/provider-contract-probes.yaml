# ---------------------------------------------------------------------------
# Fail-closed exceptions. An entry needs a reason. Nothing is excused here:
# our hand-authored baseline goldens have NOT been recorded live, so the nightly
# probe is deliberately RED until each golden is recorded behind review. That is
# the honest state - a shape nobody has verified against the live provider
# proves nothing. Recording a provider sets its `recorded_at`; there is no
# allow-list line to delete because this list starts empty and stays empty.
#
# A NEW provider added to `providers:` with no golden, or a recorded provider
# whose credential has rotated away, is NOT listed here and therefore fails the
# run - which is the point. Add an entry ONLY as a deliberate, reviewed,
# time-boxed exception, and say why.
# ---------------------------------------------------------------------------
allow_missing_credential: {}
allow_missing_golden: {}
allow_unrecorded_golden: {}

# ---------------------------------------------------------------------------
# Skips - a provider we cannot probe safely, cheaply, or without per-tenant
# configuration. Every entry states WHY.
# ---------------------------------------------------------------------------
skips:
  # --- connectors ---------------------------------------------------------
  - id: azure_key_vault
    kind: connector
    reason: "Tenant-specific vault host (https://<vault>.vault.azure.net) is required; there is no safe default endpoint."
  - id: azure_pipelines
    kind: connector
    reason: "Organisation-specific host (https://dev.azure.com/<org>) is required; there is no safe default endpoint."
  - id: azure_repos
    kind: connector
    reason: "Organisation-specific host (https://dev.azure.com/<org>) is required; there is no safe default endpoint."
  - id: ci_runner
    kind: connector
    reason: "Internal abstraction over multiple CI providers; it has no single upstream wire contract to pin."
  - id: confluence
    kind: connector
    reason: "Site-specific Atlassian host (https://<site>.atlassian.net) is required; there is no safe default endpoint."
  - id: filesystem
    kind: connector
    reason: "Local filesystem connector; it has no network provider contract."
  - id: gitea
    kind: connector
    reason: "Self-hosted instance host is required; there is no default host to probe."
  - id: grafana
    kind: connector
    reason: "Self-hosted instance host is required; there is no default host to probe."
  - id: jenkins
    kind: connector
    reason: "Self-hosted instance host is required; there is no default host to probe."
  - id: jira
    kind: connector
    reason: "Site-specific Atlassian host (https://<site>.atlassian.net) is required; there is no safe default endpoint."
  - id: n8n
    kind: connector
    reason: "Self-hosted instance host is required; there is no default host to probe."
  - id: onepassword
    kind: connector
    reason: "1Password Connect server host and token are required; there is no default host."
  - id: plane
    kind: connector
    reason: "Instance-specific host (self-hosted or regional Plane Cloud) is required; there is no safe default endpoint."
  - id: rest
    kind: connector
    reason: "Generic HTTP connector; its target is chosen per use, so there is no fixed provider contract."
  - id: shell
    kind: connector
    reason: "Local command connector; it has no network provider contract."
  - id: sharepoint
    kind: connector
    reason: "Site-scoped Microsoft Graph API; the identity call is already covered by the microsoft_teams probe, and no standalone safe read exists without a site."
  - id: teamcity
    kind: connector
    reason: "Self-hosted instance host is required; there is no default host to probe."
