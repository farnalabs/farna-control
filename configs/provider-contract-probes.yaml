# FAR-2703 - live provider contract probes.
#
# Every connector type and every model backend in the repo is either a probe
# (a cheap, read-only call whose *response shape* is pinned to a golden) or an
# explicit skip with a reason. The probe intentionally talks HTTP to the same
# endpoint the connector's own health check / cheapest read uses, so it pins the
# upstream wire contract the connector depends on without instantiating the
# connector (whose constructors need heterogeneous, per-tenant config).
#
# Schema
# ------
# defaults:               applied to every probe unless the probe overrides it
#   success_status_class: "2xx" | "4xx" | ... (status CLASS, not an exact code)
#   timeout_seconds:      per-request HTTP timeout
#   max_depth:            shape depth recorded into a golden. Check mode shapes
#                         the LIVE response at the depth the GOLDEN records (the
#                         golden is the authority, as with its status class), so
#                         this is the record-time depth and the fallback for a
#                         golden that records none.
#   strict_shape:         when true (the default) an ADDED object key is drift
#   deadline_seconds:     overall wall-clock budget for the whole check run
#   retry:                attempts / base_delay_seconds / max_delay_seconds
# providers:              list of probe definitions
#   id:                   provider id (must be unique across providers + skips)
#   kind:                 "connector" | "model_backend"
#   operation:            operation id (unique within the provider)
#   description:          what the call proves
#   request:              {method, url, json?, form?}
#   allowed_host:         the ONLY host the request.url may target. Must equal
#                         the provider id's pin in PROVIDER_HOST_PINS
#                         (scripts/provider_contract_probe.py), which is the
#                         authority; a config edit cannot introduce a host.
#   auth:                 credential declaration (see below)
#   env_vars:             the ONLY env var names this probe may read; auth.env,
#                         auth.params values and extra_headers values must be a
#                         subset. Every one of them must ALSO be in the provider
#                         id's PROVIDER_CREDENTIAL_PINS entry in
#                         scripts/provider_contract_probe.py (a code pin, the
#                         authority), so a config edit cannot make this probe
#                         read another provider's secret.
#   success_status_class: optional override
#   max_depth:            optional override (record-time depth)
#   strict_shape:         optional override
#   timeout_seconds:      optional override
#   normalise:            list of {path, rule} declared HERE, never in code
#   static_headers:       literal headers (never secrets)
#   extra_headers:        header name -> ENV VAR NAME (secret values)
# skips:                  list of {id, kind, reason}
# allow_missing_credential: mapping provider id -> reason. A recorded golden
#                         with no credential in the environment FAILS the run
#                         unless the id is listed here (rotated secret guard).
# allow_missing_golden:   mapping provider id -> reason. A probe with NO golden
#                         entry FAILS the run unless the id is listed here.
# allow_unrecorded_golden: mapping provider id -> reason. A golden whose
#                         recorded_at is null (hand-authored, never recorded
#                         live) FAILS the run unless the id is listed here.
#
# auth.kind
#   none    - no credential (public endpoint)
#   bearer  - Authorization: Bearer <env value>
#   header  - <header>: <template with {token}>  (default header Authorization)
#   query   - append each params entry as a query parameter from its env var
#
# normalise.rule
#   volatile  - replace the value with the literal "<volatile>" before shaping.
#               Stabilises ids / timestamps / etags so a change in the value (or
#               even its scalar type) never reads as drift.
#   drop      - remove the path entirely before shaping. For optional or
#               unbounded subtrees (e.g. a map of every published PyPI version).
#   nullable  - treat a null value as the string "<null>" so a legitimately
#               null field does not read as a type change.
#
# Paths are dot-separated. "*" matches every key of a dict at that level and
# "[]" matches every element of a list at that level, e.g. "data.[].id".
#
# Read-only guarantee: only GET/HEAD are accepted. `allowed_host` is a visible
# declaration that must AGREE with the host pinned for the same provider id in
# scripts/provider_contract_probe.py (PROVIDER_HOST_PINS) - the code pin is the
# authority. A new host, or a URL pointing anywhere else, is rejected, so a
# config edit alone cannot redirect a credential. The credential SET is pinned
# per provider id too (PROVIDER_CREDENTIAL_PINS): every env var, header name and
# query-param name the probe reads must be in that pin, so a `github` probe
# cannot be edited to read FARNA_PROBE_SLACK_TOKEN and send it to
# api.github.com. The few read-only POSTs are pinned to their exact URL and body
# in the same script (READ_ONLY_POST_ENDPOINTS); any other POST is rejected, so
# a config edit cannot turn a probe into a write.
#
# A secret value never enters a golden: goldens store a response SHAPE (key
# names + value types), never response values.

version: 1

defaults:
  success_status_class: "2xx"
  timeout_seconds: 20
  max_depth: 1
  strict_shape: true
  deadline_seconds: 1500
  retry:
    attempts: 3
    base_delay_seconds: 1.0
    max_delay_seconds: 30.0

providers:
