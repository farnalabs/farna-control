  # Connectors
  # -------------------------------------------------------------------------
  - id: asana
    kind: connector
    operation: users_me
    description: Current user identity (Asana GET /users/me).
    request:
      method: GET
      url: https://app.asana.com/api/1.0/users/me
    allowed_host: app.asana.com
    auth:
      kind: bearer
      env: FARNA_PROBE_ASANA_TOKEN
    env_vars:
      - FARNA_PROBE_ASANA_TOKEN
    max_depth: 2
    normalise:
      - path: data.gid
        rule: volatile

  - id: bitbucket
    kind: connector
    operation: user
    description: Current user identity (Bitbucket GET /2.0/user).
    request:
      method: GET
      url: https://api.bitbucket.org/2.0/user
    allowed_host: api.bitbucket.org
    auth:
      kind: bearer
      env: FARNA_PROBE_BITBUCKET_TOKEN
    env_vars:
      - FARNA_PROBE_BITBUCKET_TOKEN

