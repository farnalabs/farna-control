# SonarCloud configuration (read by SonarSource/sonarqube-scan-action).
#
# Only genuinely non-meaningful, data/framework-shaped repetition is excluded
# from the copy-paste (duplication) gate:
#   * frontend/src/locales/**  : i18n catalogs whose `"key": "value"` structure
#                                is data, not logic, and routinely trips the
#                                gate against existing entries.
#   * frontend/src/__tests__/** : specs share mock/setup boilerplate
#                                (vi.mock, setActivePinia, mount) with the rest
#                                of the suite, which is expected.
#   * backend/src/farna/db/migrations/**
#                              : Alembic migration RLS/grant/ORM ceremony is
#                                data/framework-shaped repetition. Each new
#                                migration copies the established ceremony from
#                                its precedent (e.g. 0240 copies the 0204
#                                rls_org_isolation + role-grant block verbatim),
#                                so SonarCloud's CPD flags the copy against the
#                                already-in-scope precedent as 67 duplicated
#                                "new" lines and fails the PR quality gate. The
#                                repetition is required DDL boilerplate, not
#                                logic duplication, so it is excluded from the
#                                duplication gate — consistent with the already-
#                                present `sonar.coverage.exclusions` entry for
#                                the same glob (see below).
#
# Production source added by this PR (consent prompt, settings views, the
# shared ToggleSwitch/ErrorAlert, the store) is intentionally NOT excluded, so
# genuine logic duplication is surfaced rather than hidden by widening the gate.
sonar.cpd.exclusions=frontend/src/locales/**,frontend/src/__tests__/**,backend/src/farna/db/migrations/**

# --- Narrow issue exclusion (NOT a blanket rule disable) ---
# `create_pipeline` in backend/src/farna/api/mcp_server.py is an MCP tool: its
# Python signature IS the tool's public JSON schema, because FastMCP derives the
# advertised parameters from it. It carries 14 flat arguments by design.
# FAR-1883 briefly nested the two nullable time-window overrides into a
# `timeouts` object purely to clear python:S107; that is a client-visible wire
# change made for a lint rule, and it left the grouping inconsistent (sibling
# `lock_wait_timeout_seconds` / `node_timeout_seconds` stayed flat) while
# removing a previously-flat, documented argument from the schema. The flat
# 14-parameter signature is the clearer contract, so S107 is excluded for this
# ONE file. Scope: rule python:S107 only, resource mcp_server.py only — every
# other rule, and S107 in every other file, still applies. (A function-scoped
# exclusion is not expressible through sonar.issue.ignore.multicriteria, which
# matches on rule + file path.)
#
# The compliance evidence index renders two horizontally scrollable tables. A
# scrollable container with no focusable descendants MUST be reachable in the
# tab order so keyboard-only users can scroll it (WCAG 2.1.1; W3C ACT rule
# 0ssw9k; axe `scrollable-region-focusable`). The implementation therefore pairs
# `tabindex="0"` with `role="region"` + `aria-labelledby` so the scroll viewport
# is a named landmark. Two Sonar "web" rules flag that W3C-required pattern:
#   * Web:S6845 ("tabindex should only be declared on interactive elements")
#     does not model scrollable containers, which are focusable by design.
#   * Web:S6819 ("prefer tag over ARIA role") wants <section>; the outer heading
#     wrapper is already a <section>, and promoting the inner scroll viewport to
#     a second section would nest two landmarks with the SAME accessible name.
# Inline suppression was tried and ignored: `<!-- NOSONAR -->` on the current
# lines (and on the preceding line before the format was collapsed) did not stop
# either rule, and PR #2471's new_maintainability_rating gate failed on exactly
# these four issues. The suppression therefore has to live here.
# Scope: rules Web:S6845 + Web:S6819 only, this ONE file only. The accessible
# behaviour is pinned by frontend/src/__tests__/ComplianceEvidenceIndexView.spec.ts.
#
# The pipelines list wraps its wide table in a horizontally scrollable region
# that must be reachable in the tab order (WCAG 2.1.1; axe
# `scrollable-region-focusable`), so it carries `tabindex="0"` plus an
# `aria-describedby` scroll instruction. This is the same focusable-scroll-
# container pattern as the compliance evidence index above, and Web:S6845 does
# not model scrollable containers. Inline NOSONAR was proven ineffective for
# this rule (see the note above), so the exclusion is scoped here: rule
# Web:S6845 only, this ONE file only. The focusable region and its keyboard
# scroll instructions are pinned by frontend/src/__tests__/PipelineListView.spec.ts.
#
# scripts/package_compose_release.py is a maintainer-run release packaging CLI,
# not a request-serving module: its only inputs are flags the release operator
# types on their own machine. Two rules misfire on it:
#   * python:S2068 ("hard-coded credential") matches the embedded init-env.sh
#     template because that shell script contains the environment-variable names
#     FARNA_CONTROL_DB_PASSWORD / SAQ_AUTH_PASSWORD. The bundle deliberately ships no
#     credential: the template derives every secret locally with openssl or
#     /dev/urandom at unpack time, which is the opposite of a hard-coded secret.
#     The literal cannot be split without degrading the generated script, and an
#     inline NOSONAR on the opening `_INIT_ENV_SH = r"""#!/bin/sh` line would
#     corrupt the emitted shebang.
#   * pythonsecurity:S8707 ("path traversal via faulty ... CLI arguments") taints
#     --output-dir/--compose-file/--env-file from argv and reports the resulting
#     mkdir/tarfile.open as a traversal sink. Writing a release archive to a
#     destination the operator names is the documented behaviour of the tool;
#     there is no HTTP/MCP request boundary here for an attacker to cross, so the
#     "malicious HTTP request" source is a misclassification of a CLI entry point.
# Both are false positives for this ONE utility file, so the exclusion is scoped
# to rule + resource here rather than disabling either rule repo-wide. The
# behaviour the rules are trying to protect is pinned by
# backend/tests/unit/scripts/test_package_compose_release.py.
#
# Two further scoped false positives (fixed 2026-11-17 after the new_security
# gate went to C on main):
#   * backend/src/farna/api/routes/observability.py — pythonsecurity:S5144
#     reports the POST in `test_otel_connection` as SSRF because it traces the
#     tenant-supplied OTLP endpoint into an outbound request. That endpoint is
#     protected in two layers: `validate_outbound_url_async` blocks
#     private/link-local/cloud-metadata/CGNAT ranges at DNS-resolution time
#     (loopback only via the explicit SSRF_ALLOW_PRIVATE_RANGES/allow_networks
#     allowlist), and the request goes through `pinned_async_client`, the
#     DNS-pinned transport that re-resolves and re-validates fail-closed on TTL
#     expiry/failover. The taint rule cannot model those custom sanitizers.
#     Pinned by backend/tests/unit/api/test_observability_routes.py (a
#     private-address endpoint is rejected and never fetched).
#   * backend/src/farna/api/routes/auth.py — python:S3330 reports the
#     XSRF-TOKEN cookie setters because `httponly=False` is deliberate: the
#     double-submit CSRF pattern requires JavaScript to read the token, so
#     HttpOnly would break it. The cookie is SameSite=strict and Secure outside
#     debug. S3330 fires only on those two XSRF setters in this file. Pinned by
#     backend/tests/unit/api/test_csrf.py and
#     backend/tests/unit/api/test_auth_routes_coverage.py.
# The admin notification delivery log wraps its wide table in a horizontally
# scrollable region that must be reachable in the tab order (WCAG 2.1.1; axe
# `scrollable-region-focusable`), so it carries `tabindex="0"` plus
# `role="region"` + `aria-label` so the scroll viewport is a named landmark.
# This is the same focusable-scroll-container pattern as the compliance evidence
# index above: Web:S6845 does not model scrollable containers, and Web:S6819
# wants <section> for the region role. Inline `<!-- NOSONAR -->` was proven
# ineffective for these web rules (see the note above), so the exclusions are
# scoped here: rules Web:S6845 + Web:S6819, this ONE file only. The accessible
# behaviour is enforced by the staging axe sweep over the manifest routes
# (frontend/tests/e2e/mobile-layout.spec.ts visits /admin/notification-delivery).
# scripts/run_check_ratchet_baseline.py is a CI-only shrink-only-baseline guard,
# not a request-serving module or an LLM tool: its inputs are the CI workflow's
# own base-revision hint (RATCHET_BASE_REV = github.event.before, GITHUB_BASE_REF)
# or a developer's local --base / --baseline flags. The pythonsecurity engine
# mislabels those CLI arguments as "LLM-supplied" and reports two sinks:
#   * pythonsecurity:S8705 - argument injection into the argv of `git`. _git runs
#     git with shell=False and a list argv, and every revision/path is now passed
#     through _validated_git_arg, which rejects any option-like value (leading
#     '-') before it reaches argv.
#   * pythonsecurity:S8707 - path traversal via --baseline. The path is resolved
#     and required to be inside the repo root (relative_to(repo_root)) before it
#     is read; anything outside returns 1 without touching the file.
# Both are false positives on a CI-only CLI. Scoped to rule + resource only, the
# same narrow pattern as the S8707 exclusion for package_compose_release.py.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14,e15,e16,e17,e18,e19,e20,e21,e22,e23,e24,e25,e26,e27,e28,e29,e30,e31,e32,e33,e34,e35,e36,e37,e38,e39,e40,e41,e42,e43
