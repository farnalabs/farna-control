services:
  db:
    image: postgres:16-alpine
    # FAR-2808: without a restart policy a container that exits stays exited and
    # `docker compose ps` presents a half-dead stack as "the stack". The app
    # services below carry one for the cold-start race; the datastores carry it
    # for the same class (a container that exited never comes back on its own).
    # `unless-stopped`, never `always`: an operator's `docker compose stop`/`down`
    # must stay stopped, including across a daemon restart - which is what
    # scripts/compose-restore.sh relies on when it stops the writers and leaves
    # the stack down.
    restart: unless-stopped
    environment:
      POSTGRES_USER: farna_control
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: farna_control
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # FAR-2808: probe the TCP interface, not the default unix socket. On a
      # first run the image's entrypoint starts a SECOND, socket-only server
      # (`listen_addresses=''`) to run initdb and create the app role/database,
      # stops it, then execs the real server (which the image configures with
      # `listen_addresses='*'`). A host-less `pg_isready` answers 0 against that
      # temporary server, so the probe went green, the app services started, the
      # temporary server stopped, and a connection in that window failed with
      # ConnectionRefusedError. `-h` keeps the probe on TCP, which the temporary
      # server never listens on, so it passes only once the real server serves
      # the same `db:5432` path the app uses. `-U`/`-d` are documentation only:
      # pg_isready reports "accepting connections" for a wrong user or database
      # too, so naming them is not what closes the window.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U farna_control -d farna_control"]
      interval: 5s
      timeout: 5s
      retries: 5
      # A cold first start runs initdb, the entrypoint's CREATE DATABASE and a
      # full shutdown/checkpoint before the server accepts connections (~80s
      # measured on a Windows/Docker Desktop host), which is past the 25s the
      # retry budget allows. Failures inside start_period do not count against
      # `retries`, so a first-run init cannot mark the DB unhealthy; a live DB
      # that later dies is still caught by the unchanged 5s x 5 retries.
      start_period: 120s

  redis:
    image: redis:8-alpine
    # FAR-2808: same class as `db` - a Redis that exits leaves every enqueue
    # failing while the rest of the stack looks up. Its dataset is rebuildable
    # (see the eviction policy below), so a restart cannot poison state the way
    # a half-initialised database could.
    restart: unless-stopped
    # FAR-2002 — bound the queue store, and evict only what the reconciler can
    # repair. Without a maxmemory, Redis runs `noeviction`: a worker wedge grows
    # the SAQ queue until every enqueue fails with `OOM command not allowed`.
    #
    # `volatile-lru` touches ONLY keys that carry a TTL. In the SAQ key space
    # that is exactly the job hashes — queued ones get a 1h TTL from the
    # dispatcher (`SAQ_QUEUED_JOB_TTL`), completed ones a 300s TTL from SAQ,
    # and in-flight ones have their TTL cleared on dequeue. The queue's
    # structural keys (`queued`/`active` lists, `incomplete` zset) are
    # persistent, so they are never evicted — losing one would drop queued work
    # with no job hash for `dispatcher_reconcile` to detect. An evicted queued
    # job hash is repaired: `q.job()` goes absent and the pending+`saq` leg
    # re-enqueues it after `SAQ_REENQUEUE_WINDOW`.
    #
    # Raise REDIS_MAXMEMORY for a larger queue budget; keep the policy.
    command:
      - redis-server
      - "--maxmemory"
      - "${REDIS_MAXMEMORY:-256mb}"
      - "--maxmemory-policy"
      - "volatile-lru"
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    build: ./backend
    # FAR-2808: this is the service the bug reported. On a cold first start the
    # db probe could go green against Postgres's temporary, socket-only init
    # server; when that server stopped, the backend's first connection failed
    # with ConnectionRefusedError and the container exited - and nothing brought
    # it back, so `docker compose ps` showed a dead API with everything else up.
    # The db probe is fixed too; this policy is the backstop for every other
    # transient exit (OOM-kill, a race in startup, a dependency arriving late),
    # because a healthcheck gates START ORDER only and can never revive a
    # process that has already exited.
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://farna_control_app:${POSTGRES_PASSWORD:-changeme}@db:5432/farna_control
      DATABASE_ADMIN_URL: postgresql+asyncpg://farna_control:${POSTGRES_PASSWORD:-changeme}@db:5432/farna_control
      # farna_control_system (LOGIN, BYPASSRLS) role URL. The entrypoint's
      # bootstrap_role parses the password out of THIS URL when it creates or
      # alters the role, so the role and the URL can never disagree; the
      # backend's cross-org reads (pre-auth SSO provider lookup, Fernet key
      # rotation) use the same URL. Same password as farna_control_app by design.
      FARNA_CONTROL_SYSTEM_DATABASE_URL: postgresql+asyncpg://farna_control_system:${POSTGRES_PASSWORD:-changeme}@db:5432/farna_control
      FARNA_CONTROL_DB: postgres
      SECRET_KEY: modulo-docker-compose-secret-key-32bytes!
      # FAR-2181: FERNET_KEY encrypts every stored credential. `Settings` only
      # checks its LENGTH (>= 32 bytes), so the 47-char placeholder this file
      # used to ship booted fine and then failed on the FIRST credential write:
      # checkpointer init died, `checkpoints` / `checkpoint_migrations` were
      # never created, /healthz/ready reported the checkpointer degraded, and
      # POST /api/v1/model-backends returned 500 while login still returned 200.
      # A Fernet key must be url-safe base64 of exactly 32 bytes
      # (`Fernet.generate_key()`), so it can never be a fixed literal here.
      # Required, never defaulted: compose refuses to start without it, which is
      # loud at `up` instead of silent at the first credential write.
      FERNET_KEY: '${FERNET_KEY:?FERNET_KEY is required - generate one (openssl rand -base64 32) and put FERNET_KEY=<value> in .env at the repo root; see docs/quickstart.md step 1}'
      SSRF_ALLOW_PRIVATE_RANGES: ${SSRF_ALLOW_PRIVATE_RANGES:-}
      REDIS_URL: redis://redis:6379/0
      FARNA_CONTROL_PUBLIC_URL: http://localhost:8000
      FARNA_CONTROL_USERS: admin:admin
      # The DB capacity monitor (FAR-1882) auto-detects capacity from the
      # Postgres data volume by default. Mount it read-only at
      # DB_CAPACITY_PATH (the default, stated here so mount and setting cannot
      # drift) and the 98% hard-stop arms itself with no DB_CAPACITY_BYTES set.
      DB_CAPACITY_PATH: /var/lib/farna/db-volume
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/src:/app/src
      - ./frontend/src/manifest.yaml:/app/manifest.yaml
      # Read-only: the monitor only statvfs()es it. If the container user
      # cannot traverse the mount the probe fails open (capacity "none", stop
      # inert) rather than erroring - set DB_CAPACITY_BYTES to override.
      - pgdata:/var/lib/farna/db-volume:ro

  # SAQ runs worker — executes run jobs (plan F8 local dev). Required for any
  # pipeline execution.
  saq-runner:
    build: ./backend
    # FAR-2808: same failure class as `backend` (see above). A dead runs worker
    # accepts no pipeline work while /healthz/ready still serves, so nothing
    # restarted it: the stack looked up and executed nothing.
    restart: unless-stopped
    command: ["python", "-m", "saq", "farna.core.saq_worker.runs_settings"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://farna_control_app:${POSTGRES_PASSWORD:-changeme}@db:5432/farna_control
      FARNA_CONTROL_DB: postgres
      SECRET_KEY: modulo-docker-compose-secret-key-32bytes!
      # FAR-2181: same required key as the backend service above - every process
      # that reads or writes a stored credential must hold the SAME Fernet key.
      FERNET_KEY: '${FERNET_KEY:?FERNET_KEY is required - generate one (openssl rand -base64 32) and put FERNET_KEY=<value> in .env at the repo root; see docs/quickstart.md step 1}'
      SSRF_ALLOW_PRIVATE_RANGES: ${SSRF_ALLOW_PRIVATE_RANGES:-}
      REDIS_URL: redis://redis:6379/0
      FARNA_CONTROL_PUBLIC_URL: http://localhost:8000
      FARNA_CONTROL_USERS: admin:admin
      # DB capacity monitor (FAR-1882). This worker EXECUTES runs, and two
      # run-creation paths run inside that execution: agent-signal child runs
      # (executor._fire_agent_signals -> trigger_engine.agent_signal) and
      # feedback reject-correction runs (node_runner._dispatch_reject_correction
      # -> feedback_manager) - both reaching crud.run.create_run. Without the
      # volume visible here those runs resolve capacity "none" and the 98%
      # hard-stop is inert for them.
      DB_CAPACITY_PATH: /var/lib/farna/db-volume
    volumes:
      - ./backend/src:/app/src
      # Read-only: the monitor only statvfs()es it. If the container user
      # cannot traverse the mount the probe fails open (capacity "none", stop
      # inert) rather than erroring - set DB_CAPACITY_BYTES to override.
      - pgdata:/var/lib/farna/db-volume:ro

  # SAQ system worker — owns the scheduler (fire_due_triggers) + reconcile +
  # system crons (plan F8). REQUIRED for local cron/triggers. Web UI bound to
  # 127.0.0.1:8081 via the custom runner.
  saq-system:
    build: ./backend
    # FAR-2808: same failure class as `backend` (see above). A dead system
    # worker stops fire_due_triggers, dispatcher_reconcile and the system crons
    # with no scheduler to revive them - every cron/polling trigger is silently
    # dead until a human notices.
    restart: unless-stopped
    command: ["python", "-m", "farna.core.saq_worker"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://farna_control_app:${POSTGRES_PASSWORD:-changeme}@db:5432/farna_control
      # Required: dispatcher_reconcile (and the other cross-org system crons)
      # build their session factory from this URL and FAIL CLOSED without it
      # (core/cron_helpers.py::_get_system_engine raises), so the cron never
      # runs, no stats heartbeat is ever written, and /healthz/ready reports
      # dispatcher_reconcile `unavailable` — which GATES readiness (503).
      FARNA_CONTROL_SYSTEM_DATABASE_URL: postgresql+asyncpg://farna_control_system:${POSTGRES_PASSWORD:-changeme}@db:5432/farna_control
      FARNA_CONTROL_DB: postgres
      SECRET_KEY: modulo-docker-compose-secret-key-32bytes!
      # FAR-2181: same required key as the backend service above.
      FERNET_KEY: '${FERNET_KEY:?FERNET_KEY is required - generate one (openssl rand -base64 32) and put FERNET_KEY=<value> in .env at the repo root; see docs/quickstart.md step 1}'
      SSRF_ALLOW_PRIVATE_RANGES: ${SSRF_ALLOW_PRIVATE_RANGES:-}
      REDIS_URL: redis://redis:6379/0
      FARNA_CONTROL_PUBLIC_URL: http://localhost:8000
      FARNA_CONTROL_USERS: admin:admin
      SAQ_AUTH_USERNAME: admin
      SAQ_AUTH_PASSWORD: modulo
      DB_CAPACITY_PATH: /var/lib/farna/db-volume
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./backend/src:/app/src
      # Cron/polling triggers create their runs in THIS process
      # (cron_helpers.fire_cron_trigger / _run_poll_fire / _create_ongoing_runs
      # all call crud.run.create_run), which is where the 98% hard-stop is
      # enforced - so the volume must be visible here too (FAR-1882).
      - pgdata:/var/lib/farna/db-volume:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:80"

  # Health watchdog — Gatus (https://gatus.io), config-as-code in
  # deploy/watchdog/. Probes the backend's readiness over the compose network
  # and tells the operator when Modulo is unhealthy — including when the app is
  # fully down, which is the one failure the app cannot report about itself.
  # Enabled by default: it comes up with `docker compose up`.
  #
  # No `depends_on` on the backend, deliberately — this service is the thing
  # that reports the backend being unhealthy, so it must start regardless.
  #
  # Monitoring is on from the first `up`; email alerting stays off until
  # SMTP_HOST / SMTP_PORT / EMAIL_FROM / ALERT_EMAIL_TO are set (the same
  # variables the app uses for HITL email — one SMTP setup serves both). With
  # them unset the container logs one line saying so and keeps monitoring.
  # See deploy/watchdog/README.md and docs/deployment.md §Health watchdog.
  watchdog:
    build: ./deploy/watchdog
    restart: unless-stopped
    environment:
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    volumes:
      - ./deploy/watchdog/config.yaml:/config/config.yaml:ro
    ports:
      - "127.0.0.1:8082:8080"
    healthcheck:
      # Exec form — the derived image has busybox wget but no shell-form is
      # needed. Exits non-zero when the dashboard does not answer, so a wedged
      # watchdog is visible as `unhealthy` in `docker ps`.
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
